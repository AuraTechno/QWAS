<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Messenger FINAL</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:#fff;
}

/* AUTH */
#auth{
width:340px;
margin:120px auto;
display:flex;
flex-direction:column;
gap:10px;
text-align:center;
}

#auth input{
padding:14px;
border:none;
border-radius:10px;
background:#1a1a1a;
color:#fff;
}

#auth button{
padding:14px;
border:none;
border-radius:10px;
background:#fff;
font-weight:bold;
cursor:pointer;
}

/* APP */
#chat{
display:none;
height:100vh;
}

/* USERS */
.sidebar{
width:280px;
background:#111;
border-right:1px solid #222;
overflow:auto;
}

.user{
display:flex;
align-items:center;
gap:10px;
padding:12px;
border-bottom:1px solid #1f1f1f;
cursor:pointer;
transition:.2s;
}

.user:hover{
background:#1a1a1a;
}

.avatar{
width:38px;
height:38px;
border-radius:50%;
background:#333;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.online{
width:8px;
height:8px;
border-radius:50%;
background:#2ecc71;
margin-left:auto;
}

/* CHAT */
.chat{
flex:1;
display:flex;
flex-direction:column;
}

.header{
padding:15px;
border-bottom:1px solid #222;
}

.messages{
flex:1;
padding:15px;
overflow:auto;
display:flex;
flex-direction:column;
gap:8px;
}

.msg{
max-width:70%;
padding:10px 12px;
border-radius:14px;
animation:pop .15s ease;
}

@keyframes pop{
from{transform:scale(0.95);opacity:0}
to{transform:scale(1);opacity:1}
}

.me{
align-self:flex-end;
background:#fff;
color:#000;
}

.other{
align-self:flex-start;
background:#1a1a1a;
border:1px solid #333;
}

.meta{
font-size:10px;
opacity:0.7;
text-align:right;
margin-top:3px;
}

/* INPUT */
.input{
display:flex;
padding:10px;
gap:8px;
border-top:1px solid #222;
background:#0f0f0f;
}

.input input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#1a1a1a;
color:#fff;
}

.input button{
width:50px;
border:none;
border-radius:10px;
background:#fff;
cursor:pointer;
}

</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
<h3>LOGIN</h3>
<input id="u" placeholder="username">
<input id="p" type="password">
<button onclick="login()">Войти</button>
<button onclick="register()">Регистрация</button>
</div>

<!-- CHAT -->
<div id="chat">

<div class="sidebar" id="users"></div>

<div class="chat">

<div class="header" id="chatName">Chat</div>

<div class="messages" id="messages"></div>

<div class="input">
<input id="msg">
<button onclick="send()">➤</button>
</div>

</div>

</div>

<script>

let socket=null;
let token="";
let username="";
let current="";

/* LOGIN */
function login(){

fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:u.value,
password:p.value
})
})
.then(r=>r.json())
.then(d=>{

if(!d.ok){
alert("error");
return;
}

token=d.token;
username=u.value;

auth.style.display="none";
chat.style.display="flex";

/* SOCKET */
socket=io({
auth:{token},
transports:["websocket","polling"]
});

socket.on("connect",()=>{
socket.emit("join");
});

/* USERS UI FIX */
socket.on("users",data=>{
users.innerHTML="";

data.forEach(u=>{
users.innerHTML+=`
<div class="user" onclick="openChat('${u.username}')">

<div class="avatar">
${u.username[0].toUpperCase()}
</div>

<div>${u.username}</div>

<div class="online" style="opacity:${u.online?1:0.2}"></div>

</div>`;
});
});

/* REALTIME MESSAGE FIX */
socket.on("new_message",m=>{
if(m.from===current || m.to===current){
render(m);
}
});

/* HISTORY */
socket.on("chat_history",m=>{
messages.innerHTML="";
m.forEach(render);
});

/* READ */
socket.on("read_update",()=>{
document.querySelectorAll(".msg.me .meta").forEach(el=>{
el.innerText="✔✔";
});
});

});
}

/* REGISTER */
function register(){
fetch("/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:u.value,
password:p.value
})
});
}

/* OPEN CHAT */
function openChat(u){
current=u;
chatName.innerText=u;

socket.emit("get_history",u);

socket.emit("read",{
from:u,
to:username
});
}

/* SEND */
function send(){

if(!msg.value||!current)return;

socket.emit("private_message",{
to:current,
message:msg.value
});

msg.value="";
}

/* RENDER */
function render(m){

let div=document.createElement("div");
div.className="msg "+(m.from===username?"me":"other");

div.innerHTML=`
<div>${m.message}</div>
<div class="meta">${m.status==="read"?"✔✔":"✔"}</div>
`;

messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
}

</script>

</body>
</html>
