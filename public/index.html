<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/favicon-32.png">
<title>QWAS Messenger</title>
<script src="/socket.io/socket.io.js"></script>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/mobile.css">
</head>
<body>

<div class="notification-container" id="notificationContainer"></div>

<!-- Авторизация -->
<div id="auth">
  <div class="auth-container">
    <h1>QWAS</h1>
    <input id="loginUsername" placeholder="Имя пользователя" autocomplete="off" autocapitalize="none">
    <input id="loginPassword" type="password" placeholder="Пароль" autocomplete="off">
    <button class="btn-primary" onclick="QWAS.Auth.handleLogin()">Войти</button>
    <button class="auth-link" onclick="QWAS.Auth.openRegisterModal()">Создать аккаунт</button>
  </div>
</div>

<!-- Регистрация -->
<div class="modal" id="registerModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Регистрация</h2>
      <button class="close-btn" onclick="QWAS.Auth.closeRegisterModal()">&times;</button>
    </div>
    <div class="modal-field">
      <input type="text" id="regUsername" placeholder="Имя пользователя" autocomplete="off">
    </div>
    <div class="modal-field">
      <input type="password" id="regPassword" placeholder="Пароль" autocomplete="new-password">
    </div>
    <div class="modal-field">
      <input type="password" id="regConfirmPassword" placeholder="Подтверждение пароля">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="QWAS.Auth.closeRegisterModal()">Отмена</button>
      <button class="btn btn-primary" onclick="QWAS.Auth.handleRegister()">Создать</button>
    </div>
  </div>
</div>

<!-- Чат -->
<div id="chat">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>QWAS</h2>
      <div class="user-info" onclick="QWAS.Profile.open()">
        <div class="user-avatar" id="myAvatar">U</div>
        <div style="flex:1;">
          <div id="myUsername" style="font-weight:600;">username</div>
          <div style="font-size:13px;color:var(--text-tertiary);">онлайн</div>
        </div>
      </div>
    </div>
    
    <div class="search-container">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск..." autocomplete="off">
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
    
    <div class="sidebar-actions">
      <button class="sidebar-action-btn" onclick="QWAS.Groups.openCreateModal()" title="Создать группу">＋</button>
    </div>
    
    <div class="section-title" id="groupsSectionTitle" style="display:none;">Группы и каналы</div>
    <div class="users-list" id="groupsList" style="display:none;"></div>
    
    <div class="section-title">Чаты</div>
    <div class="users-list" id="users"></div>
  </div>
  
  <div class="chat-area">
    <div class="chat-header" id="chatHeader" style="display: none;">
      <button class="mobile-back-btn" onclick="QWAS.Chat.showSidebar()">←</button>
      <div class="user-avatar small" id="chatAvatar">U</div>
      <div class="chat-header-info">
        <h3 id="chatUsername">Выберите чат</h3>
        <div class="online-status" id="chatStatus"></div>
      </div>
      <div class="chat-header-actions" id="chatHeaderActions" style="display:none;">
        <button class="header-icon-btn" onclick="QWAS.Groups.showMembers()" title="Участники">👥</button>
        <button class="header-icon-btn" onclick="QWAS.Groups.leaveGroup()" title="Выйти">🚪</button>
      </div>
    </div>
    
    <div class="messages-container" id="messages">
      <div class="empty-state">
        <div class="empty-state-icon">💬</div>
        <h3>QWAS Messenger</h3>
        <p>Выберите чат или найдите пользователя</p>
      </div>
    </div>
    
    <!-- Кнопка скролла вниз -->
    <div class="scroll-to-bottom" id="scrollToBottomBtn" onclick="QWAS.Messages.scrollToBottom()">
      <span>↓</span>
      <span class="scroll-unread-badge" id="scrollUnreadBadge"></span>
    </div>
    
    <div id="typingIndicator" class="typing-indicator"></div>
    
    <div class="message-input-container">
      <input class="message-input" id="msg" placeholder="Сообщение..." disabled>
      <button class="send-button" id="sendBtn" onclick="QWAS.Messages.send()" disabled>➤</button>
    </div>
  </div>
</div>

<!-- Меню сообщения -->
<div class="message-menu" id="messageMenu">
  <div class="message-menu-item" onclick="QWAS.Messages.forward()">↗ Переслать</div>
  <div class="message-menu-item" onclick="QWAS.Messages.edit()">✎ Редактировать</div>
  <div class="message-menu-item danger" onclick="QWAS.Messages.delete()">🗑 Удалить</div>
</div>

<!-- Пересылка -->
<div class="modal" id="forwardModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Переслать</h2>
      <button class="close-btn" onclick="QWAS.Messages.closeForwardModal()">&times;</button>
    </div>
    <div class="forward-chat-list" id="forwardChatList"></div>
  </div>
</div>

<!-- Профиль -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Профиль</h2>
      <button class="close-btn" onclick="QWAS.Profile.close()">&times;</button>
    </div>
    
    <div style="position: relative; width: 120px; margin: 0 auto 28px;">
      <div class="profile-avatar-large" id="profileAvatarLarge" onclick="document.getElementById('avatarInput').click()">
        <span id="profileAvatarText">U</span>
        <img id="profileAvatarImg" style="display:none; width:100%; height:100%; border-radius:50%; object-fit:cover;">
      </div>
      <div class="avatar-edit-badge" onclick="document.getElementById('avatarInput').click()">📷</div>
    </div>
    
    <div class="modal-field">
      <label>Имя пользователя</label>
      <input type="text" id="profileUsername" readonly onclick="QWAS.Profile.copyUsername()">
      <div class="copy-feedback" id="copyFeedback">✓ Скопировано!</div>
    </div>
    
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="QWAS.Profile.save()">Сохранить</button>
      <button class="btn btn-danger" onclick="QWAS.Auth.logout()">Выйти</button>
    </div>
  </div>
</div>

<input type="file" id="avatarInput" accept="image/*">

<!-- Создание группы -->
<div class="modal" id="createGroupModal">
  <div class="modal-content" style="max-width:450px;">
    <div class="modal-header">
      <h2>Создать группу</h2>
      <button class="close-btn" onclick="QWAS.Groups.closeCreateModal()">&times;</button>
    </div>
    <div class="modal-field">
      <label>Название</label>
      <input type="text" id="groupNameInput" placeholder="Название группы" autocomplete="off">
    </div>
    <div class="modal-field">
      <label>Описание (необязательно)</label>
      <input type="text" id="groupDescInput" placeholder="Описание" autocomplete="off">
    </div>
    <div class="modal-field">
      <label>Тип</label>
      <select id="groupTypeSelect" style="width:100%; padding:16px; background:var(--bg-primary); border:1px solid var(--border); border-radius:14px; color:var(--text-primary); font-size:16px; outline:none;">
        <option value="group">👥 Группа</option>
        <option value="channel">📢 Канал</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Участники</label>
      <div id="groupMemberSelect" class="member-select-list"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="QWAS.Groups.closeCreateModal()">Отмена</button>
      <button class="btn btn-primary" onclick="QWAS.Groups.handleCreate()">Создать</button>
    </div>
  </div>
</div>

<!-- Участники группы -->
<div class="modal" id="groupMembersModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Участники</h2>
      <button class="close-btn" onclick="QWAS.Groups.closeMembersModal()">&times;</button>
    </div>
    <div id="groupMembersList" class="member-select-list"></div>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/groups.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/notifications.js"></script>
<script src="/js/socket.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/messages.js"></script>
<script src="/js/search.js"></script>
<script src="/js/profile.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
