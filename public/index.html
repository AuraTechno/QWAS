<body>

<div class="modal" id="profileModal">

  <button onclick="register()">Создать аккаунт</button>

        <div class="user-avatar" id="myAvatar">U</div>
        <div class="user-info-text">
          <div class="username" id="myUsername">username</div>
          <div class="status">Онлайн</div>
        </div>
      </div>
    </div>
    
    <!-- Поиск -->
    <div class="search-container">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск @username..." autocomplete="off">
        <button class="clear-search" id="clearSearch">✕</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
    
    <div class="section-title">Чаты</div>
    <div class="users-list" id="users"></div>
  </div>
  
  <div class="chat-area">
    <div class="chat-header" id="chatHeader" style="display: none;">

      <div class="user-avatar small" id="chatAvatar">U</div>

        <div class="online-status" id="chatStatus"></div>
      </div>
      <button class="mobile-leave-chat" onclick="leaveChat()" title="Выйти из чата">✕</button>
    </div>
    
    <div class="messages-container" id="messages">
      <div class="empty-state">
        <div class="empty-state-icon">💬</div>
        <h3>Добро пожаловать в QWAS</h3>
        <p>Выберите чат или найдите пользователя</p>
      </div>
    </div>
    
    <div id="typingIndicator" class="typing-indicator"></div>
    
    <div class="message-input-container">
      <input class="message-input" id="msg" placeholder="Сообщение..." disabled autocomplete="off">
      <button class="send-button" id="sendBtn" onclick="send()" disabled>➤</button>
    </div>
  </div>
</div>

<script>
let socket, me = "", current = "", typingTimeout = null;
let onlineUsers = new Map();
let userToken = "";
let currentUser = { avatar: "", avatarColor: "#667eea" };
let selectedColor = "#667eea";
let uploadedAvatar = null;
let chatList = [];
let allUsers = [];

const colors = ["#667eea", "#764ba2", "#e74c3c", "#3498db", "#2ecc71", "#f39c12", "#1abc9c", "#e67e22", "#9b59b6", "#e91e63", "#00bcd4", "#ff5722"];

// Инициализация
document.addEventListener('DOMContentLoaded', () => {
  const picker = document.getElementById('colorPicker');
  colors.forEach(color => {
    const div = document.createElement('div');
    div.className = 'color-option';
    div.style.background = color;
    div.onclick = () => selectColor(color);
    picker.appendChild(div);
  });
  
  // Настройка поиска
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearSearch');
  const resultsDiv = document.getElementById('searchResults');
  
  searchInput.addEventListener('input', function() {
    const val = this.value;
    clearBtn.style.display = val ? 'block' : 'none';
    
    if (val.length >= 1) {
      searchUsersLocal(val);
      resultsDiv.classList.add('show');
    } else {
      resultsDiv.classList.remove('show');
    }
  });
  
  searchInput.addEventListener('focus', function() {
    if (this.value.length >= 1) {
      resultsDiv.classList.add('show');
    }
  });
  
  clearBtn.addEventListener('click', function() {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    resultsDiv.classList.remove('show');
  });
  
  // Закрытие поиска при клике вне
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-container')) {
      resultsDiv.classList.remove('show');
    }
  });
});

function selectColor(color) {
  selectedColor = color;
  document.querySelectorAll('.color-option').forEach(el => {
    el.classList.toggle('selected', el.style.background === color);
  });
  updateAvatarPreview();
}

function getAvatarLetter(u) { 
  return u ? u.charAt(0).toUpperCase() : '?'; 
}

function updateAvatarPreview() {
  const textSpan = document.getElementById('profileAvatarText');
  const imgEl = document.getElementById('profileAvatarImg');
  const avatarDiv = document.getElementById('profileAvatarLarge');
  
  if (uploadedAvatar) {
    imgEl.src = uploadedAvatar;
    imgEl.style.display = 'block';
    textSpan.style.display = 'none';
    avatarDiv.style.background = 'transparent';
  } else {
    imgEl.style.display = 'none';
    textSpan.style.display = 'block';
    textSpan.textContent = getAvatarLetter(me);
    avatarDiv.style.background = selectedColor;
  }
}

function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    uploadedAvatar = e.target.result;
    updateAvatarPreview();
  };
  reader.readAsDataURL(file);
}

function openProfile() {
  document.getElementById('profileModal').classList.add('show');
  document.getElementById('profileUsername').value = '@' + me;
  
  selectedColor = currentUser.avatarColor || "#667eea";
  uploadedAvatar = currentUser.avatar || null;
  
  document.querySelectorAll('.color-option').forEach(el => {
    el.classList.toggle('selected', el.style.background === selectedColor);
  });
  
  updateAvatarPreview();
}

function closeProfile() {
  document.getElementById('profileModal').classList.remove('show');
}

async function saveProfile() {
  try {
    const response = await fetch('/profile/update', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${userToken}`
      },
      body: JSON.stringify({
        avatar: uploadedAvatar,
        avatarColor: selectedColor
      })
    });
    
    const data = await response.json();
    if (data.ok) {
      currentUser.avatar = uploadedAvatar;
      currentUser.avatarColor = selectedColor;
      updateMyAvatar();
      socket.emit('profile_updated');
      closeProfile();
    }
  } catch (err) {
    console.error('Save profile error:', err);
  }
}

function updateMyAvatar() {
  const avatarEl = document.getElementById('myAvatar');
  if (currentUser.avatar) {
    avatarEl.style.backgroundImage = `url(${currentUser.avatar})`;
    avatarEl.style.backgroundSize = 'cover';
    avatarEl.textContent = '';
  } else {
    avatarEl.style.backgroundImage = 'none';
    avatarEl.style.background = currentUser.avatarColor || '#667eea';
    avatarEl.textContent = getAvatarLetter(me);
  }
}

// Поиск пользователей
function searchUsersLocal(query) {
  const resultsDiv = document.getElementById('searchResults');
  
  if (query.length < 1) {
    resultsDiv.classList.remove('show');
    return;
  }
  
  // Убираем @ для поиска
  const cleanQuery = query.replace(/^@/, '').toLowerCase();
  
  // Фильтруем всех пользователей (исключая себя)
  const filtered = allUsers.filter(u => 
    u.username !== me && 
    u.username.toLowerCase().includes(cleanQuery)
  );
  
  if (filtered.length === 0) {
    resultsDiv.innerHTML = '<div class="no-results">Пользователи не найдены</div>';
  } else {
    resultsDiv.innerHTML = filtered.slice(0, 10).map(u => `
      <div class="search-result-item" onclick="startChatWith('${u.username}')">
        <div class="user-avatar small" style="${u.avatar ? `background-image:url(${u.avatar});background-size:cover` : `background:${u.avatarColor || '#667eea'}`}">
          ${u.avatar ? '' : getAvatarLetter(u.username)}
        </div>
        <div class="user-content">
          <div class="user-name">@${u.username}</div>
        </div>
      </div>
    `).join('');
  }
  
  resultsDiv.classList.add('show');
}

function startChatWith(username) {
  // Очищаем поиск
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearch').style.display = 'none';
  document.getElementById('searchResults').classList.remove('show');
  
  // Проверяем есть ли уже такой чат
  const existingChat = chatList.find(c => c.username === username);
  
  if (!existingChat) {
    // Добавляем пользователя в список чатов
    const userData = allUsers.find(u => u.username === username);
    if (userData) {
      chatList.push({
        username: userData.username,
        avatar: userData.avatar,
        avatarColor: userData.avatarColor,
        online: false
      });
      renderChatList();
    }
  }
  
  selectUser(username);
}

function leaveChat() {
  current = "";
  document.getElementById('chatHeader').style.display = 'none';
  document.getElementById('msg').disabled = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('messages').innerHTML = `
    <div class="empty-state">
      <div class="empty-state-icon">💬</div>
      <h3>Добро пожаловать в QWAS</h3>
      <p>Выберите чат или найдите пользователя</p>
    </div>
  `;
  document.getElementById('typingIndicator').textContent = '';
  
  document.querySelectorAll('.user').forEach(el => el.classList.remove('selected'));
  
  if (window.innerWidth <= 768) {
    showSidebar();
  }
}

function register() {
  let u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  
  u = u.replace(/^@/, '');
  
  if(!u||!p) return alert('Введите логин и пароль');
  if(!/^[a-zA-Z0-9_]+$/.test(u)) return alert('Имя пользователя может содержать только буквы, цифры и _');
  
  fetch("/register", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:u,password:p})
  })
  .then(r=>r.json())
  .then(d=>alert(d.ok?'Регистрация успешна!':'Ошибка: '+(d.error||'')));
}

async function login() {
  let u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  
  u = u.replace(/^@/, '');
  
  if(!u||!p) return alert('Введите логин и пароль');
  
  try {
    const response = await fetch("/login", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:u,password:p})
    });
    const d = await response.json();
    
    if(!d.ok) return alert('Ошибка: '+(d.error||'Неверный логин или пароль'));
    
    me = u;
    userToken = d.token;
    currentUser = d.user;
    
    document.getElementById('auth').style.display='none';
    document.getElementById('chat').style.display='flex';
    document.getElementById('myUsername').textContent = '@' + me;
    
    updateMyAvatar();
    
    // Подключаем сокет
    connectSocket(d.token);
    
    // Загружаем чаты
    await loadChatList();
    
    // Загружаем всех пользователей для поиска
    await loadAllUsers();
    
  } catch (err) {
    console.error('Login error:', err);
    alert('Ошибка входа');
  }
}

async function loadAllUsers() {
  try {
    const response = await fetch('/users/all', {
      headers: { 'Authorization': `Bearer ${userToken}` }
    });
    const data = await response.json();
    if (data.ok) {
      allUsers = data.users;
      console.log('✅ Loaded users for search:', allUsers.length);
    }
  } catch (err) {
    console.error('Load all users error:', err);
  }
}

async function loadChatList() {
  try {
    const response = await fetch('/chats', {
      headers: { 'Authorization': `Bearer ${userToken}` }
    });
    const data = await response.json();
    chatList = data.chats;
    renderChatList();
  } catch (err) {
    console.error('Load chats error:', err);
  }
}

function renderChatList() {
  const container = document.getElementById("users");
  
  if (chatList.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💭</div><p>Нет активных чатов</p><p style="font-size:13px;margin-top:8px;">Используйте поиск 🔍</p></div>';
    return;
  }
  
  container.innerHTML = '';
  
  chatList.sort((a, b) => a.username.localeCompare(b.username));
  
  chatList.forEach(u => {
    const div = document.createElement("div");
    div.className = "user" + (current === u.username ? " selected" : "");
    div.onclick = () => selectUser(u.username);
    
    const avatar = document.createElement("div");
    avatar.className = "user-avatar small";
    if (u.avatar) {
      avatar.style.backgroundImage = `url(${u.avatar})`;
      avatar.style.backgroundSize = 'cover';
    } else {
      avatar.style.background = u.avatarColor || "#667eea";
      avatar.textContent = getAvatarLetter(u.username);
    }
    div.appendChild(avatar);
    
    const content = document.createElement('div');
    content.className = 'user-content';
    content.innerHTML = `<div class="user-name">@${u.username}</div><div class="user-status">${u.online?'Онлайн':'Офлайн'}</div>`;
    div.appendChild(content);
    
    const ind = document.createElement('span');
    ind.className = u.online ? 'online-indicator' : 'offline-indicator';
    div.appendChild(ind);
    
    container.appendChild(div);
  });
}

function connectSocket(token) {
  socket = io({ auth: { token } });
  
  socket.on("connect", () => console.log("✅ Connected"));
  
  socket.on("chat_list", chats => {
    chatList = chats;
    renderChatList();
  });
  
  socket.on("new_message", msg => {
    if(msg.from === current || msg.to === current) {
      addMessageToChat(msg);
      if(msg.to === me && current === msg.from) socket.emit("read", {from: msg.from, to: me});
    }
    loadChatList();
  });
  
  socket.on("chat_history", msgs => renderHistory(msgs));
  
  socket.on("read_update", data => {
    data.messages.forEach(id => {
      const el = document.getElementById(`msg-${id}`);
      if(el) { 
        const s = el.querySelector('.message-status'); 
        if(s) s.textContent = '✓✓'; 
      }
    });
  });
  
  socket.on("typing", d => { 
    if(d.from === current) document.getElementById('typingIndicator').textContent = `@${current} печатает...`; 
  });
  
  socket.on("stop_typing", d => { 
    if(d.from === current) document.getElementById('typingIndicator').textContent = ''; 
  });
  
  socket.on("all_users", users => {
    allUsers = users;
    console.log('✅ Received all users via socket:', users.length);
  });
}

function selectUser(username) {
  current = username;
  
  document.querySelectorAll('.user').forEach(el => {
    el.classList.remove('selected');
    if(el.querySelector('.user-name')?.textContent === '@' + username) {
      el.classList.add('selected');
    }
  });
  
  const userData = chatList.find(u => u.username === username) || 
                   allUsers.find(u => u.username === username) || {};
  
  document.getElementById('chatHeader').style.display = 'flex';
  
  const chatAvatar = document.getElementById('chatAvatar');
  if (userData.avatar) {
    chatAvatar.style.backgroundImage = `url(${userData.avatar})`;
    chatAvatar.style.backgroundSize = 'cover';
    chatAvatar.textContent = '';
  } else {
    chatAvatar.style.backgroundImage = 'none';
    chatAvatar.style.background = userData.avatarColor || "#667eea";
    chatAvatar.textContent = getAvatarLetter(username);
  }
  
  document.getElementById('chatUsername').textContent = '@' + username;
  document.getElementById('chatStatus').textContent = userData.online ? 'Онлайн' : 'Офлайн';
  document.getElementById('msg').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('typingIndicator').textContent = '';
  
  if(window.innerWidth <= 768) hideSidebar();
  socket.emit("get_history", username);
}

function renderHistory(msgs) {
  const c = document.getElementById("messages");
  c.innerHTML = msgs.length ? '' : '<div class="empty-state"><div class="empty-state-icon">💭</div><p>Нет сообщений. Начните общение!</p></div>';
  msgs.forEach(m => addMessageToChat(m));
}

function addMessageToChat(msg) {
  const c = document.getElementById("messages");
  if(c.children.length === 1 && c.children[0].classList.contains('empty-state')) c.innerHTML = '';
  if(document.getElementById(`msg-${msg._id}`)) return;
  
  const isMe = msg.from === me;
  const userData = isMe ? currentUser : (chatList.find(u => u.username === msg.from) || allUsers.find(u => u.username === msg.from) || {});
  
  const d = document.createElement("div");
  d.className = `message ${isMe ? "me" : "other"}`;
  d.id = `msg-${msg._id}`;
  
  const avatar = document.createElement("div");
  avatar.style.cssText = "width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;color:#fff;text-transform:uppercase;";
  if (userData.avatar) {
    avatar.style.backgroundImage = `url(${userData.avatar})`;
    avatar.style.backgroundSize = 'cover';
  } else {
    avatar.style.background = userData.avatarColor || "#667eea";
    avatar.textContent = getAvatarLetter(msg.from);
  }
  d.appendChild(avatar);
  
  const cnt = document.createElement("div");
  cnt.style.flex = "1";
  
  const bubble = document.createElement("div");
  bubble.className = "message-bubble";
  bubble.textContent = msg.message;
  cnt.appendChild(bubble);
  
  const meta = document.createElement("div");
  meta.className = "message-meta";
  
  const time = document.createElement("span");
  time.textContent = new Date(msg.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  meta.appendChild(time);
  
  if(isMe) {
    const status = document.createElement("span");
    status.className = "message-status";
    status.textContent = msg.status === "read" ? '✓✓' : '✓';
    meta.appendChild(status);
  }
  
  cnt.appendChild(meta);
  d.appendChild(cnt);
  c.appendChild(d);
  
  setTimeout(() => c.scrollTop = c.scrollHeight, 100);
}

function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if(!text||!current) return;
  
  socket.emit("send_message", {to: current, message: text});
  input.value = "";
  socket.emit("stop_typing", current);
  
  if(typingTimeout) clearTimeout(typingTimeout);
  input.focus();
}

function logout() {
  if(socket) socket.disconnect();
  me = ""; current = ""; userToken = ""; chatList = []; allUsers = [];
  document.getElementById('auth').style.display='block';
  document.getElementById('chat').style.display='none';
  document.getElementById('u').value = '';
  document.getElementById('p').value = '';
  closeProfile();
}

function showSidebar() { 
  document.getElementById('sidebar').classList.remove('hidden'); 
}

function hideSidebar() { 
  if(window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.add('hidden');
  }
}

// Отслеживание печати
document.getElementById("msg").addEventListener("input", () => {
  if(!current) return;
  socket.emit("typing", current);
  if(typingTimeout) clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => { 
    socket.emit("stop_typing", current); 
  }, 1000);
});

document.getElementById("msg").addEventListener("keypress", e => { 
  if(e.key === "Enter") {
    e.preventDefault();
    send();
  }
});

// Предотвращаем pull-to-refresh
document.addEventListener('touchmove', (e) => {
  if (e.target.closest('.messages-container')) return;
}, { passive: false });

</script>
</body>
</html>
