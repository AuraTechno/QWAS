<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PRO STABLE 2</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0d0d0d;
    color:#fff;
}

#auth{
    width:320px;
    margin:120px auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input{
    padding:12px;
    border:none;
    border-radius:8px;
    background:#1a1a1a;
    color:#fff;
}

button{
    padding:12px;
    border:none;
    border-radius:8px;
    background:#fff;
    color:#000;
}

#chat{
    display:none;
    height:100vh;
}

.sidebar{
    width:280px;
    background:#111;
    border-right:1px solid #222;
    overflow:auto;
}

.user{
    padding:12px;
    border-bottom:1px solid #222;
    cursor:pointer;
}

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    padding:10px;
    overflow:auto;
}

.msg{
    margin:6px 0;
}

.me{text-align:right;}
.other{text-align:left;}

.bubble{
    display:inline-block;
    padding:10px;
    border-radius:8px;
    background:#1a1a1a;
}

.me .bubble{
    background:#fff;
    color:#000;
}
</style>
</head>

<body>

<div id="auth">
    <input id="u" placeholder="username">
    <input id="p" type="password" placeholder="password">

    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
</div>

<div id="chat">

    <div class="sidebar" id="users"></div>

    <div class="chat">

        <div id="chatName"></div>

        <div class="messages" id="messages"></div>

        <input id="msg">
        <button onclick="send()">Send</button>

    </div>
</div>

<script>
let socket;
let token="";
let username="";
let current="";

/* REGISTER */
function register(){
fetch("/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u.value,password:p.value})
});
}

/* LOGIN (STABLE FIX) */
function login(){
fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u.value,password:p.value})
})
.then(r=>r.json())
.then(d=>{

if(!d.ok){
alert("login error");
return;
}

token=d.token;
username=u.value;

auth.style.display="none";
chat.style.display="flex";

/* SOCKET ONLY AFTER LOGIN */
socket=io({
auth:{token}
});

/* EVENTS */
socket.on("connect",()=>{
socket.emit("join");
});

socket.on("users",renderUsers);
socket.on("private_message",renderMsg);
socket.on("chat_history",renderHistory);

});
}

/* USERS */
function renderUsers(data){
users.innerHTML="";

data.users.forEach(u=>{
if(u.username!==username){
users.innerHTML+=`
<div class="user" onclick="openChat('${u.username}')">
${u.username}
</div>`;
}
});
}

/* OPEN */
function openChat(u){
current=u;
chatName.innerText=u;
socket.emit("get_history",u);
}

/* SEND */
function send(){
if(!msg.value||!current)return;

socket.emit("private_message",{
to:current,
message:msg.value
});

msg.value="";
}

/* HISTORY */
function renderHistory(msgs){
messages.innerHTML="";
msgs.forEach(renderMsg);
}

/* MESSAGE */
function renderMsg(m){

if(m.from!==username && m.to!==username && m.from!==current && m.to!==current)
return;

let me=m.from===username;

messages.innerHTML+=`
<div class="msg ${me?'me':'other'}">
<div class="bubble">${m.message}</div>
</div>`;
}
</script>

</body>
</html>
