
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" href="/favicon-32.png">
<title>QWAS Messenger</title>
<script src="/socket.io/socket.io.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; }

#auth {
  width: 100%; max-width: 400px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 15px;
  padding: 30px 20px; background: #1a1a1a;
  border-radius: 16px; position: absolute;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
}

#auth h1 {
  text-align: center; font-size: 32px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

#auth input {
  padding: 14px; border-radius: 10px; border: 1px solid #333;
  background: #0a0a0a; color: #fff; font-size: 16px;
}

#auth button {
  padding: 14px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white; font-weight: bold; font-size: 16px;
  cursor: pointer; min-height: 48px;
}

#chat { display: none; height: 100dvh; display: flex; }

.sidebar {
  width: 300px; background: #111; border-right: 1px solid #222;
  overflow-y: auto; display: flex; flex-direction: column;
}

@media (max-width: 768px) {
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 100%; z-index: 10; }
  .sidebar.hidden { display: none; }
}

.sidebar-header {
  padding: 20px 16px; border-bottom: 1px solid #222;
  background: #0a0a0a;
}

.sidebar-header h2 {
  font-size: 24px; background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.user-info {
  display: flex; align-items: center; gap: 12px;
  margin-top: 15px; padding-top: 15px; border-top: 1px solid #222;
  cursor: pointer;
}

.user-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: 18px; color: white;
  text-transform: uppercase; background-size: cover;
}

.user-avatar.small { width: 40px; height: 40px; font-size: 16px; }

.search-container {
  padding: 12px 16px;
  border-bottom: 1px solid #222;
}

.search-box {
  display: flex;
  align-items: center;
  background: #1a1a1a;
  border-radius: 24px;
  padding: 8px 16px;
  gap: 8px;
}

.search-box input {
  flex: 1;
  background: none;
  border: none;
  color: #fff;
  font-size: 16px;
  padding: 8px 0;
  outline: none;
}

.search-results {
  max-height: 300px;
  overflow-y: auto;
  margin-top: 8px;
  background: #1a1a1a;
  border-radius: 12px;
}

.search-result-item {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  border-bottom: 1px solid #222;
}

.search-result-item:active { background: #222; }

.section-title {
  padding: 12px 16px 4px;
  font-size: 13px;
  color: #666;
  text-transform: uppercase;
}

.users-list { flex: 1; }

.user {
  padding: 14px 16px; border-bottom: 1px solid #1a1a1a;
  cursor: pointer; display: flex; align-items: center; gap: 14px;
  position: relative;
}

.user.selected { background: #1e1e1e; border-left: 4px solid #667eea; }

.online-indicator, .offline-indicator {
  position: absolute; bottom: 14px; right: 16px;
  width: 12px; height: 12px; border-radius: 50%; border: 2px solid #111;
}
.online-indicator { background: #00ff00; }
.offline-indicator { background: #666; }

.user-name { font-weight: 500; font-size: 16px; }
.user-status { font-size: 13px; color: #888; }

.chat-area { flex: 1; display: flex; flex-direction: column; background: #0a0a0a; }

.chat-header {
  padding: 12px 16px; background: #111; border-bottom: 1px solid #222;
  display: flex; align-items: center; gap: 12px;
}

.mobile-back-btn {
  display: none; background: none; border: none;
  color: #fff; font-size: 24px; cursor: pointer;
}

@media (max-width: 768px) {
  .mobile-back-btn { display: block; }
}

.chat-header-info { flex: 1; }

.messages-container {
  flex: 1; padding: 16px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px;
}

.message {
  display: flex; gap: 8px; max-width: 85%;
}
.message.me { align-self: flex-end; flex-direction: row-reverse; }

.message-bubble {
  padding: 12px 14px; border-radius: 18px;
  background: #1e1e1e; color: #fff;
}
.message.me .message-bubble {
  background: linear-gradient(135deg, #667eea, #764ba2);
}

.message-meta {
  display: flex; align-items: center; gap: 6px;
  margin-top: 4px; font-size: 11px; color: #888;
}

.typing-indicator {
  padding: 8px 16px; font-size: 13px; color: #888;
}

.message-input-container {
  padding: 12px 16px; background: #111; border-top: 1px solid #222;
  display: flex; gap: 10px;
}

.message-input {
  flex: 1; padding: 12px 16px; border-radius: 24px;
  border: 1px solid #333; background: #0a0a0a; color: #fff;
  font-size: 16px;
}

.send-button {
  width: 48px; height: 48px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white; font-size: 22px; cursor: pointer;
}

.empty-state { text-align: center; color: #666; padding: 40px; }
.empty-state-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }

/* Модалка профиля */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.9);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal.show { display: flex; }

.modal-content {
  background: #1a1a1a;
  border-radius: 20px;
  padding: 24px;
  width: 90%;
  max-width: 400px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 24px;
}

.close-btn {
  background: none;
  border: none;
  color: #888;
  font-size: 28px;
  cursor: pointer;
}

.profile-avatar-large {
  width: 120px; height: 120px; border-radius: 50%;
  margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; font-weight: bold; color: white;
  cursor: pointer; position: relative;
}

.color-picker {
  display: flex; gap: 8px; flex-wrap: wrap;
  justify-content: center; margin: 16px 0;
}

.color-option {
  width: 36px; height: 36px; border-radius: 50%;
  cursor: pointer; border: 3px solid transparent;
}

.color-option.selected { border-color: white; }

.profile-field {
  margin-bottom: 16px;
}

.profile-field input {
  width: 100%; padding: 14px; border-radius: 10px;
  border: 1px solid #333; background: #0a0a0a; color: #fff;
}

.profile-actions {
  display: flex; gap: 12px;
}

.btn {
  flex: 1; padding: 14px; border-radius: 10px; border: none;
  font-weight: bold; cursor: pointer;
}

.btn-primary {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
}

.btn-danger {
  background: #e74c3c;
  color: white;
}

#avatarInput { display: none; }
</style>
</head>
<body>

<!-- Модалка профиля -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Профиль</h2>
      <button class="close-btn" onclick="closeProfile()">&times;</button>
    </div>
    
    <div class="profile-avatar-large" id="profileAvatarLarge" onclick="document.getElementById('avatarInput').click()">
      <span id="profileAvatarText">U</span>
      <img id="profileAvatarImg" style="display:none; width:100%; height:100%; border-radius:50%; object-fit:cover;">
    </div>
    
    <div class="color-picker" id="colorPicker"></div>
    
    <div class="profile-field">
      <input type="text" id="profileUsername" readonly>
    </div>
    
    <div class="profile-actions">
      <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
      <button class="btn btn-danger" onclick="logout()">Выйти</button>
    </div>
  </div>
</div>

<input type="file" id="avatarInput" accept="image/*">

<div id="auth">
  <h1>💬 QWAS</h1>
  <input id="u" placeholder="Имя пользователя" autocomplete="off">
  <input id="p" type="password" placeholder="Пароль">
  <button onclick="login()">Войти</button>
  <button onclick="register()">Создать аккаунт</button>
</div>

<div id="chat" style="display:none">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>💬 QWAS</h2>
      <div class="user-info" onclick="openProfile()">
        <div class="user-avatar" id="myAvatar">U</div>
        <div>
          <div id="myUsername">username</div>
          <div style="font-size:13px;color:#888;">Онлайн</div>
        </div>
      </div>
    </div>
    
    <div class="search-container">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск @username..." autocomplete="off">
      </div>
      <div class="search-results" id="searchResults" style="display:none;"></div>
    </div>
    
    <div class="section-title">Чаты</div>
    <div class="users-list" id="users"></div>
  </div>
  
  <div class="chat-area">
    <div class="chat-header" id="chatHeader" style="display: none;">
      <button class="mobile-back-btn" onclick="showSidebar()">←</button>
      <div class="user-avatar small" id="chatAvatar">U</div>
      <div class="chat-header-info">
        <h3 id="chatUsername">Выберите чат</h3>
        <div id="chatStatus" style="font-size:13px;color:#888;"></div>
      </div>
    </div>
    
    <div class="messages-container" id="messages">
      <div class="empty-state">
        <div class="empty-state-icon">💬</div>
        <h3>Добро пожаловать в QWAS</h3>
        <p>Выберите чат или найдите пользователя</p>
      </div>
    </div>
    
    <div id="typingIndicator" class="typing-indicator"></div>
    
    <div class="message-input-container">
      <input class="message-input" id="msg" placeholder="Сообщение..." disabled>
      <button class="send-button" id="sendBtn" onclick="send()" disabled>➤</button>
    </div>
  </div>
</div>

<script>
let socket, me = "", current = "", typingTimeout = null;
let userToken = "";
let currentUser = { avatar: "", avatarColor: "#667eea" };
let selectedColor = "#667eea";
let uploadedAvatar = null;
let chatList = [];
let allUsers = [];

const colors = ["#667eea", "#764ba2", "#e74c3c", "#3498db", "#2ecc71", "#f39c12", "#1abc9c", "#e67e22"];

// Инициализация цветов
colors.forEach(color => {
  const div = document.createElement('div');
  div.className = 'color-option';
  div.style.background = color;
  div.onclick = () => selectColor(color);
  document.getElementById('colorPicker').appendChild(div);
});

// Поиск
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', function() {
  const query = this.value.trim().toLowerCase();
  
  if (query.length === 0) {
    searchResults.style.display = 'none';
    return;
  }
  
  // Фильтруем пользователей
  const filtered = allUsers.filter(u => 
    u.username !== me && 
    u.username.toLowerCase().includes(query.replace(/^@/, ''))
  );
  
  if (filtered.length === 0) {
    searchResults.innerHTML = '<div style="padding:16px;text-align:center;color:#666;">Ничего не найдено</div>';
  } else {
    searchResults.innerHTML = filtered.slice(0, 10).map(u => `
      <div class="search-result-item" onclick="startChatWith('${u.username}')">
        <div class="user-avatar small" style="background:${u.avatarColor || '#667eea'};">
          ${getAvatarLetter(u.username)}
        </div>
        <div>
          <div class="user-name">@${u.username}</div>
        </div>
      </div>
    `).join('');
  }
  
  searchResults.style.display = 'block';
});

searchInput.addEventListener('focus', () => {
  if (searchInput.value.trim().length > 0) {
    searchResults.style.display = 'block';
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-container')) {
    searchResults.style.display = 'none';
  }
});

function selectColor(color) {
  selectedColor = color;
  document.querySelectorAll('.color-option').forEach(el => {
    el.classList.toggle('selected', el.style.background === color);
  });
}

function getAvatarLetter(u) { 
  return u ? u.charAt(0).toUpperCase() : '?'; 
}

function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    uploadedAvatar = e.target.result;
    document.getElementById('profileAvatarImg').src = uploadedAvatar;
    document.getElementById('profileAvatarImg').style.display = 'block';
    document.getElementById('profileAvatarText').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

document.getElementById('avatarInput').addEventListener('change', handleAvatarUpload);

function openProfile() {
  document.getElementById('profileModal').classList.add('show');
  document.getElementById('profileUsername').value = '@' + me;
  selectedColor = currentUser.avatarColor || "#667eea";
  uploadedAvatar = currentUser.avatar || null;
  
  if (uploadedAvatar) {
    document.getElementById('profileAvatarImg').src = uploadedAvatar;
    document.getElementById('profileAvatarImg').style.display = 'block';
    document.getElementById('profileAvatarText').style.display = 'none';
  } else {
    document.getElementById('profileAvatarImg').style.display = 'none';
    document.getElementById('profileAvatarText').style.display = 'block';
    document.getElementById('profileAvatarText').textContent = getAvatarLetter(me);
    document.getElementById('profileAvatarLarge').style.background = selectedColor;
  }
}

function closeProfile() {
  document.getElementById('profileModal').classList.remove('show');
}

async function saveProfile() {
  await fetch('/profile/update', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${userToken}`
    },
    body: JSON.stringify({ avatar: uploadedAvatar, avatarColor: selectedColor })
  });
  currentUser.avatar = uploadedAvatar;
  currentUser.avatarColor = selectedColor;
  updateMyAvatar();
  closeProfile();
}

function updateMyAvatar() {
  const el = document.getElementById('myAvatar');
  if (currentUser.avatar) {
    el.style.backgroundImage = `url(${currentUser.avatar})`;
    el.style.backgroundSize = 'cover';
    el.textContent = '';
  } else {
    el.style.background = currentUser.avatarColor;
    el.textContent = getAvatarLetter(me);
  }
}

function startChatWith(username) {
  searchInput.value = '';
  searchResults.style.display = 'none';
  
  if (!chatList.find(c => c.username === username)) {
    const user = allUsers.find(u => u.username === username);
    if (user) {
      chatList.push({ ...user, online: false });
      renderChatList();
    }
  }
  selectUser(username);
}

function register() {
  let u = document.getElementById('u').value.trim().replace(/^@/, '');
  const p = document.getElementById('p').value;
  
  if(!u||!p) return alert('Введите логин и пароль');
  
  fetch("/register", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:u,password:p})
  })
  .then(r=>r.json())
  .then(d=>alert(d.ok?'Успешно!':'Ошибка: '+d.error));
}

async function login() {
  let u = document.getElementById('u').value.trim().replace(/^@/, '');
  const p = document.getElementById('p').value;
  
  if(!u||!p) return alert('Введите логин и пароль');
  
  const res = await fetch("/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:u,password:p})
  });
  const d = await res.json();
  
  if(!d.ok) return alert('Ошибка: '+d.error);
  
  me = u;
  userToken = d.token;
  currentUser = d.user;
  
  document.getElementById('auth').style.display='none';
  document.getElementById('chat').style.display='flex';
  document.getElementById('myUsername').textContent = '@' + me;
  updateMyAvatar();
  
  // Загружаем всех пользователей
  const usersRes = await fetch('/users/all', {
    headers: { 'Authorization': `Bearer ${userToken}` }
  });
  const usersData = await usersRes.json();
  allUsers = usersData.users || [];
  console.log('📋 Загружено пользователей:', allUsers.length);
  
  // Загружаем чаты
  const chatsRes = await fetch('/chats', {
    headers: { 'Authorization': `Bearer ${userToken}` }
  });
  const chatsData = await chatsRes.json();
  chatList = chatsData.chats || [];
  renderChatList();
  
  connectSocket(d.token);
}

function renderChatList() {
  const container = document.getElementById("users");
  
  if (chatList.length === 0) {
    container.innerHTML = '<div class="empty-state"><div>💭</div><p>Нет чатов</p></div>';
    return;
  }
  
  container.innerHTML = chatList.sort((a,b) => a.username.localeCompare(b.username)).map(u => `
    <div class="user ${current === u.username ? 'selected' : ''}" onclick="selectUser('${u.username}')">
      <div class="user-avatar small" style="background:${u.avatarColor || '#667eea'};">
        ${getAvatarLetter(u.username)}
      </div>
      <div style="flex:1;">
        <div class="user-name">@${u.username}</div>
        <div class="user-status">${u.online?'Онлайн':'Офлайн'}</div>
      </div>
      <span class="${u.online?'online':'offline'}-indicator"></span>
    </div>
  `).join('');
}

function connectSocket(token) {
  socket = io({ auth: { token } });
  
  socket.on("chat_list", chats => {
    chatList = chats;
    renderChatList();
  });
  
  socket.on("new_message", msg => {
    if(msg.from === current || msg.to === current) {
      addMessageToChat(msg);
      if(msg.to === me) socket.emit("read", {from: msg.from, to: me});
    }
  });
  
  socket.on("chat_history", msgs => {
    const c = document.getElementById("messages");
    c.innerHTML = msgs.length ? '' : '<div class="empty-state"><div>💭</div><p>Нет сообщений</p></div>';
    msgs.forEach(m => addMessageToChat(m));
  });
  
  socket.on("read_update", data => {
    data.messages.forEach(id => {
      const el = document.getElementById(`msg-${id}`);
      if(el) el.querySelector('.message-status').textContent = '✓✓';
    });
  });
  
  socket.on("typing", d => {
    if(d.from === current) document.getElementById('typingIndicator').textContent = `@${current} печатает...`;
  });
  
  socket.on("stop_typing", d => {
    if(d.from === current) document.getElementById('typingIndicator').textContent = '';
  });
}

function selectUser(username) {
  current = username;
  
  document.querySelectorAll('.user').forEach(el => {
    el.classList.remove('selected');
    if(el.querySelector('.user-name')?.textContent === '@' + username) {
      el.classList.add('selected');
    }
  });
  
  const user = chatList.find(u => u.username === username) || allUsers.find(u => u.username === username) || {};
  
  document.getElementById('chatHeader').style.display = 'flex';
  document.getElementById('chatAvatar').style.background = user.avatarColor || '#667eea';
  document.getElementById('chatAvatar').textContent = getAvatarLetter(username);
  document.getElementById('chatUsername').textContent = '@' + username;
  document.getElementById('chatStatus').textContent = user.online ? 'Онлайн' : 'Офлайн';
  document.getElementById('msg').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('messages').innerHTML = '';
  
  if(window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.add('hidden');
  }
  
  socket.emit("get_history", username);
}

function addMessageToChat(msg) {
  const c = document.getElementById("messages");
  if(c.children.length === 1 && c.children[0].classList.contains('empty-state')) c.innerHTML = '';
  if(document.getElementById(`msg-${msg._id}`)) return;
  
  const isMe = msg.from === me;
  
  const div = document.createElement("div");
  div.className = `message ${isMe ? 'me' : 'other'}`;
  div.id = `msg-${msg._id}`;
  
  div.innerHTML = `
    <div style="width:32px;height:32px;border-radius:50%;background:${isMe ? currentUser.avatarColor : '#667eea'};display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;">
      ${getAvatarLetter(msg.from)}
    </div>
    <div style="flex:1;">
      <div class="message-bubble">${msg.message}</div>
      <div class="message-meta">
        <span>${new Date(msg.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
        ${isMe ? `<span class="message-status">${msg.status==='read'?'✓✓':'✓'}</span>` : ''}
      </div>
    </div>
  `;
  
  c.appendChild(div);
  c.scrollTop = c.scrollHeight;
}

function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if(!text||!current) return;
  
  socket.emit("send_message", {to: current, message: text});
  input.value = "";
}

function logout() {
  if(socket) socket.disconnect();
  location.reload();
}

function showSidebar() {
  document.getElementById('sidebar').classList.remove('hidden');
}

// Отправка по Enter
document.getElementById("msg").addEventListener("keypress", e => {
  if(e.key === "Enter") { e.preventDefault(); send(); }
});

// Печать
let typingTimer;
document.getElementById("msg").addEventListener("input", () => {
  if(!current) return;
  socket.emit("typing", current);
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => socket.emit("stop_typing", current), 1000);
});

</script>
</body>
