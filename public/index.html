<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QWAS">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" href="/favicon-32.png">
<title>QWAS Messenger</title>
<script src="/socket.io/socket.io.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

html, body {
  width: 100%;
  height: 100%;
  position: fixed;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: pan-x pan-y;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
  background: #0a0a0a;
  color: #fff;
}

/* Уведомления */
.notification-container {
  position: fixed;
  top: max(20px, env(safe-area-inset-top));
  left: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.notification {
  padding: 14px 18px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 500;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  pointer-events: auto;
  animation: slideDown 0.3s ease;
  display: flex;
  align-items: center;
  gap: 10px;
  backdrop-filter: blur(10px);
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.notification-success { background: rgba(46, 204, 113, 0.95); color: white; }
.notification-error { background: rgba(231, 76, 60, 0.95); color: white; }
.notification-info { background: rgba(102, 126, 234, 0.95); color: white; }
.notification-warning { background: rgba(243, 156, 18, 0.95); color: white; }
.notification-icon { font-size: 20px; }
.notification-message { flex: 1; }

/* Страница входа */
#auth {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #0a0a0a;
}

.auth-container {
  width: 100%;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 30px 24px;
  background: #1a1a1a;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.auth-container h1 {
  text-align: center;
  font-size: 32px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.auth-container input {
  padding: 16px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #0a0a0a;
  color: #fff;
  font-size: 16px;
  outline: none;
}

.auth-container input:focus { border-color: #667eea; }

.auth-container button {
  padding: 16px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  min-height: 52px;
  transition: opacity 0.2s;
}

.auth-container button:active { opacity: 0.8; }
.auth-container .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
.auth-container .btn-secondary { background: #333; color: white; }

.auth-footer {
  display: flex;
  justify-content: center;
  margin-top: 8px;
}

.auth-link {
  color: #667eea;
  text-decoration: none;
  font-size: 14px;
  cursor: pointer;
  background: none;
  border: none;
}

.auth-link:hover { text-decoration: underline; }

/* Основной чат */
#chat {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  background: #0a0a0a;
  overflow: hidden;
}

/* Сайдбар */
.sidebar {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 100%;
  max-width: 320px;
  background: #111;
  border-right: 1px solid #222;
  display: flex;
  flex-direction: column;
  z-index: 10;
  transform: translateX(0);
  transition: transform 0.3s ease;
}

@media (min-width: 769px) {
  .sidebar { position: relative; width: 300px; }
  #chat { display: none; flex-direction: row; }
}

.sidebar.hidden { transform: translateX(-100%); }

.sidebar-header {
  padding: 20px 16px;
  padding-top: max(20px, env(safe-area-inset-top));
  border-bottom: 1px solid #222;
  background: #0a0a0a;
  flex-shrink: 0;
}

.sidebar-header h2 {
  font-size: 24px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid #222;
  cursor: pointer;
}

.user-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 18px;
  color: white;
  text-transform: uppercase;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}

.user-avatar.small { width: 40px; height: 40px; font-size: 16px; }

.user-info-text { flex: 1; }
.user-info-text .username { font-weight: 600; font-size: 16px; }
.user-info-text .status { font-size: 13px; color: #888; margin-top: 2px; }

/* Поиск */
.search-container {
  padding: 12px 16px;
  border-bottom: 1px solid #222;
  flex-shrink: 0;
}

.search-box {
  display: flex;
  align-items: center;
  background: #1a1a1a;
  border-radius: 24px;
  padding: 8px 16px;
  gap: 8px;
}

.search-box input {
  flex: 1;
  background: none;
  border: none;
  color: #fff;
  font-size: 16px;
  padding: 8px 0;
  outline: none;
}

.search-box input::placeholder { color: #666; }

.search-results {
  max-height: 300px;
  overflow-y: auto;
  margin-top: 8px;
  background: #1a1a1a;
  border-radius: 12px;
  display: none;
}

.search-result-item {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  border-bottom: 1px solid #222;
}

.search-result-item:active { background: #222; }

.section-title {
  padding: 12px 16px 4px;
  font-size: 12px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}

.users-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: env(safe-area-inset-bottom);
}

.user {
  padding: 14px 16px;
  border-bottom: 1px solid #1a1a1a;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
}

.user:active { background: #1a1a1a; }
.user.selected { background: #1e1e1e; border-left: 4px solid #667eea; }

.online-indicator, .offline-indicator {
  position: absolute;
  bottom: 14px;
  right: 16px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid #111;
}
.online-indicator { background: #00ff00; }
.offline-indicator { background: #666; }

.user-content { flex: 1; }
.user-name { font-weight: 500; font-size: 16px; margin-bottom: 4px; }
.user-status { font-size: 13px; color: #888; }

/* Область чата */
.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #0a0a0a;
  position: relative;
}

@media (max-width: 768px) {
  .chat-area { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
}

.chat-header {
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: #111;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  min-height: 64px;
}

.mobile-back-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 28px;
  cursor: pointer;
  padding: 4px 8px;
  display: none;
}

@media (max-width: 768px) {
  .mobile-back-btn { display: block; }
}

.chat-header-info { flex: 1; }
.chat-header-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
.chat-header-info .online-status { font-size: 13px; color: #888; }

/* Сообщения */
.messages-container {
  flex: 1;
  padding: 16px 12px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.message {
  display: flex;
  gap: 8px;
  max-width: 85%;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.me {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.message-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
  color: white;
  text-transform: uppercase;
  flex-shrink: 0;
  background-size: cover;
  background-position: center;
}

.message-content { flex: 1; min-width: 0; }

.message-bubble {
  padding: 10px 14px;
  border-radius: 18px;
  word-break: break-word;
  font-size: 15px;
  line-height: 1.4;
  background: #1e1e1e;
  color: #fff;
}

.message.me .message-bubble {
  background: linear-gradient(135deg, #667eea, #764ba2);
}

.message-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  font-size: 11px;
  color: #888;
  padding: 0 4px;
}

.message.me .message-meta { justify-content: flex-end; }
.message-status { color: #4CAF50; }

/* Индикатор печати */
.typing-indicator {
  padding: 8px 16px;
  font-size: 13px;
  color: #888;
  font-style: italic;
  min-height: 36px;
  flex-shrink: 0;
}

/* Поле ввода */
.message-input-container {
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: #111;
  border-top: 1px solid #222;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-shrink: 0;
}

.message-input {
  flex: 1;
  padding: 12px 16px;
  border-radius: 24px;
  border: 1px solid #333;
  background: #0a0a0a;
  color: #fff;
  font-size: 16px;
  line-height: 1.4;
  min-height: 48px;
  outline: none;
}

.message-input:focus { border-color: #667eea; }
.message-input:disabled { opacity: 0.5; }

.send-button {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  font-size: 22px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, opacity 0.2s;
}

.send-button:active { transform: scale(0.92); }
.send-button:disabled { opacity: 0.3; cursor: not-allowed; }

/* Пустые состояния */
.empty-state {
  text-align: center;
  color: #666;
  padding: 40px 20px;
}

.empty-state-icon {
  font-size: 64px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-state h3 {
  font-size: 18px;
  margin-bottom: 8px;
  color: #fff;
}

.empty-state p { font-size: 14px; }

/* Модальные окна */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.9);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
}

.modal.show { display: flex; }

.modal-content {
  background: #1a1a1a;
  border-radius: 24px;
  padding: 24px;
  width: 90%;
  max-width: 380px;
  max-height: 80vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.modal-header h2 {
  font-size: 20px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.close-btn {
  background: none;
  border: none;
  color: #888;
  font-size: 28px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}

.profile-avatar-large {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  font-weight: bold;
  color: white;
  text-transform: uppercase;
  cursor: pointer;
  position: relative;
  background-size: cover;
  background-position: center;
}

.avatar-edit-badge {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #333;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  border: 2px solid #1a1a1a;
}

.color-picker {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 16px 0;
}

.color-option {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  border: 3px solid transparent;
  transition: transform 0.15s;
}

.color-option:active { transform: scale(0.9); }
.color-option.selected { border-color: white; }

.modal-field {
  margin-bottom: 20px;
}

.modal-field label {
  display: block;
  font-size: 13px;
  color: #888;
  margin-bottom: 6px;
}

.modal-field input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #0a0a0a;
  color: #fff;
  font-size: 16px;
  outline: none;
}

.modal-field input:focus { border-color: #667eea; }
.modal-field input:read-only { opacity: 0.7; }

.modal-actions {
  display: flex;
  gap: 12px;
}

.btn {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  transition: opacity 0.2s;
}

.btn:active { opacity: 0.8; }
.btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
.btn-danger { background: #e74c3c; color: white; }
.btn-secondary { background: #333; color: white; }

.modal-footer {
  margin-top: 16px;
  text-align: center;
}

.modal-link {
  color: #667eea;
  text-decoration: none;
  font-size: 14px;
  cursor: pointer;
  background: none;
  border: none;
}

.modal-link:hover { text-decoration: underline; }

#avatarInput { display: none; }

/* Скроллбар */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

/* Подсказка по формату */
.field-hint {
  font-size: 12px;
  color: #666;
  margin-top: 4px;
}

.password-strength {
  height: 4px;
  background: #333;
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}

.password-strength-bar {
  height: 100%;
  width: 0%;
  transition: width 0.3s, background 0.3s;
}
</style>
</head>
<body>

<!-- Контейнер для уведомлений -->
<div class="notification-container" id="notificationContainer"></div>

<!-- Страница входа -->
<div id="auth">
  <div class="auth-container">
    <h1>💬 QWAS</h1>
    <input id="loginUsername" type="text" placeholder="Имя пользователя" autocomplete="off" autocapitalize="none" autocorrect="off">
    <input id="loginPassword" type="password" placeholder="Пароль" autocomplete="off">
    <button class="btn-primary" onclick="handleLogin()">Войти</button>
    <div class="auth-footer">
      <button class="auth-link" onclick="openRegisterModal()">Создать аккаунт</button>
    </div>
  </div>
</div>

<!-- Модальное окно регистрации -->
<div class="modal" id="registerModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Регистрация</h2>
      <button class="close-btn" onclick="closeRegisterModal()">&times;</button>
    </div>
    
    <div class="modal-field">
      <label>Имя пользователя</label>
      <input type="text" id="regUsername" placeholder="username" autocomplete="off" autocapitalize="none" autocorrect="off" maxlength="20">
      <div class="field-hint">Только буквы, цифры и _ (без @)</div>
    </div>
    
    <div class="modal-field">
      <label>Пароль</label>
      <input type="password" id="regPassword" placeholder="••••••••" autocomplete="new-password">
      <div class="password-strength">
        <div class="password-strength-bar" id="passwordStrengthBar"></div>
      </div>
    </div>
    
    <div class="modal-field">
      <label>Подтверждение пароля</label>
      <input type="password" id="regConfirmPassword" placeholder="••••••••" autocomplete="new-password">
    </div>
    
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeRegisterModal()">Отмена</button>
      <button class="btn btn-primary" onclick="handleRegister()">Зарегистрироваться</button>
    </div>
    
    <div class="modal-footer">
      <button class="modal-link" onclick="switchToLogin()">Уже есть аккаунт? Войти</button>
    </div>
  </div>
</div>

<!-- Основной чат -->
<div id="chat">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>💬 QWAS</h2>
      <div class="user-info" onclick="openProfile()">
        <div class="user-avatar" id="myAvatar">U</div>
        <div class="user-info-text">
          <div class="username" id="myUsername">username</div>
          <div class="status">Онлайн</div>
        </div>
      </div>
    </div>
    
    <div class="search-container">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск @username..." autocomplete="off" autocorrect="off">
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
    
    <div class="section-title">Чаты</div>
    <div class="users-list" id="users"></div>
  </div>
  
  <div class="chat-area">
    <div class="chat-header" id="chatHeader" style="display: none;">
      <button class="mobile-back-btn" onclick="showSidebar()">←</button>
      <div class="user-avatar small" id="chatAvatar">U</div>
      <div class="chat-header-info">
        <h3 id="chatUsername">Выберите чат</h3>
        <div class="online-status" id="chatStatus"></div>
      </div>
    </div>
    
    <div class="messages-container" id="messages">
      <div class="empty-state">
        <div class="empty-state-icon">💬</div>
        <h3>Добро пожаловать в QWAS</h3>
        <p>Выберите чат или найдите пользователя</p>
      </div>
    </div>
    
    <div id="typingIndicator" class="typing-indicator"></div>
    
    <div class="message-input-container">
      <input class="message-input" id="msg" placeholder="Сообщение..." disabled autocomplete="off" autocapitalize="sentences">
      <button class="send-button" id="sendBtn" onclick="send()" disabled>➤</button>
    </div>
  </div>
</div>

<!-- Модальное окно профиля -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Профиль</h2>
      <button class="close-btn" onclick="closeProfile()">&times;</button>
    </div>
    
    <div class="profile-avatar-large" id="profileAvatarLarge" onclick="document.getElementById('avatarInput').click()">
      <span id="profileAvatarText">U</span>
      <img id="profileAvatarImg" style="display:none; width:100%; height:100%; border-radius:50%; object-fit:cover;">
      <div class="avatar-edit-badge">📷</div>
    </div>
    
    <div class="color-picker" id="colorPicker"></div>
    
    <div class="modal-field">
      <label>Имя пользователя</label>
      <input type="text" id="profileUsername" readonly>
    </div>
    
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
      <button class="btn btn-danger" onclick="logout()">Выйти</button>
    </div>
  </div>
</div>

<input type="file" id="avatarInput" accept="image/*">

<script>
// Глобальные переменные
let socket;
let me = "";
let current = "";
let typingTimeout = null;
let userToken = "";
let currentUser = { avatar: "", avatarColor: "#667eea" };
let selectedColor = "#667eea";
let uploadedAvatar = null;
let chatList = [];
let allUsers = [];
let isMobile = window.innerWidth <= 768;

const colors = ["#667eea", "#764ba2", "#e74c3c", "#3498db", "#2ecc71", "#f39c12", "#1abc9c", "#e67e22", "#9b59b6", "#e91e63"];

// ========== Утилиты ==========
function checkMobile() { isMobile = window.innerWidth <= 768; }
window.addEventListener('resize', checkMobile);

function showNotification(message, type = 'info') {
  const container = document.getElementById('notificationContainer');
  const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
  
  const notification = document.createElement('div');
  notification.className = `notification notification-${type}`;
  notification.innerHTML = `
    <span class="notification-icon">${icons[type] || 'ℹ️'}</span>
    <span class="notification-message">${escapeHtml(message)}</span>
  `;
  
  container.appendChild(notification);
  
  setTimeout(() => {
    notification.style.opacity = '0';
    notification.style.transform = 'translateY(-20px)';
    notification.style.transition = 'all 0.3s ease';
    setTimeout(() => notification.remove(), 300);
  }, 4000);
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function getAvatarLetter(u) { return u ? u.charAt(0).toUpperCase() : '?'; }

// ========== Модальные окна ==========
function openRegisterModal() {
  document.getElementById('registerModal').classList.add('show');
  document.getElementById('regUsername').focus();
}

function closeRegisterModal() {
  document.getElementById('registerModal').classList.remove('show');
  document.getElementById('regUsername').value = '';
  document.getElementById('regPassword').value = '';
  document.getElementById('regConfirmPassword').value = '';
  document.getElementById('passwordStrengthBar').style.width = '0%';
}

function switchToLogin() {
  closeRegisterModal();
}

// Проверка силы пароля
document.getElementById('regPassword').addEventListener('input', function() {
  const password = this.value;
  const bar = document.getElementById('passwordStrengthBar');
  
  let strength = 0;
  if (password.length >= 6) strength += 25;
  if (password.length >= 8) strength += 25;
  if (/[A-Z]/.test(password)) strength += 15;
  if (/[0-9]/.test(password)) strength += 15;
  if (/[^A-Za-z0-9]/.test(password)) strength += 20;
  
  bar.style.width = Math.min(strength, 100) + '%';
  if (strength < 40) bar.style.background = '#e74c3c';
  else if (strength < 70) bar.style.background = '#f39c12';
  else bar.style.background = '#2ecc71';
});

// ========== Регистрация ==========
async function handleRegister() {
  const username = document.getElementById('regUsername').value.trim();
  const password = document.getElementById('regPassword').value;
  const confirmPassword = document.getElementById('regConfirmPassword').value;
  
  if (!username || !password) {
    showNotification('Введите логин и пароль', 'warning');
    return;
  }
  
  if (!/^[a-zA-Z0-9_]+$/.test(username)) {
    showNotification('Логин может содержать только буквы, цифры и _', 'error');
    return;
  }
  
  if (password.length < 6) {
    showNotification('Пароль должен быть не менее 6 символов', 'warning');
    return;
  }
  
  if (password !== confirmPassword) {
    showNotification('Пароли не совпадают', 'error');
    return;
  }
  
  try {
    const res = await fetch("/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const d = await res.json();
    
    if (d.ok) {
      showNotification(d.message || 'Регистрация успешна! Теперь войдите.', 'success');
      closeRegisterModal();
      // Автоматически заполняем логин на странице входа
      document.getElementById('loginUsername').value = username;
      document.getElementById('loginPassword').focus();
    } else {
      showNotification(d.error || 'Ошибка регистрации', 'error');
    }
  } catch (err) {
    showNotification('Ошибка соединения с сервером', 'error');
  }
}

// ========== Вход ==========
function handleLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  
  if (!username || !password) {
    showNotification('Введите логин и пароль', 'warning');
    return;
  }
  
  login(username, password);
}

async function login(username, password) {
  let cleanUsername = username.replace(/^@/, '');
  
  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: cleanUsername, password })
    });
    const d = await res.json();
    
    if (!d.ok) {
      showNotification(d.error || 'Ошибка входа', 'error');
      return;
    }
    
    me = cleanUsername;
    userToken = d.token;
    currentUser = d.user;
    
    localStorage.setItem('qwas_token', d.token);
    localStorage.setItem('qwas_user', JSON.stringify(d.user));
    
    showNotification(d.message || 'Вход выполнен!', 'success');
    
    document.getElementById('auth').style.display = 'none';
    document.getElementById('chat').style.display = isMobile ? 'block' : 'flex';
    document.getElementById('myUsername').textContent = '@' + me;
    updateMyAvatar();
    
    await loadAllUsers();
    await loadChatList();
    connectSocket(d.token);
  } catch (err) {
    showNotification('Ошибка соединения с сервером', 'error');
  }
}

// ========== Авто-вход ==========
async function checkAutoLogin() {
  const savedToken = localStorage.getItem('qwas_token');
  const savedUser = localStorage.getItem('qwas_user');
  
  if (!savedToken || !savedUser) return;
  
  try {
    const res = await fetch('/auto-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: savedToken })
    });
    const d = await res.json();
    
    if (d.ok) {
      me = d.user.username;
      userToken = savedToken;
      currentUser = d.user;
      
      document.getElementById('auth').style.display = 'none';
      document.getElementById('chat').style.display = isMobile ? 'block' : 'flex';
      document.getElementById('myUsername').textContent = '@' + me;
      updateMyAvatar();
      
      await loadAllUsers();
      await loadChatList();
      connectSocket(savedToken);
      
      showNotification(`С возвращением, @${me}!`, 'success');
    } else {
      localStorage.removeItem('qwas_token');
      localStorage.removeItem('qwas_user');
    }
  } catch (err) {
    console.error('Auto-login error:', err);
  }
}

// ========== Профиль ==========
function initColorPicker() {
  const picker = document.getElementById('colorPicker');
  colors.forEach(color => {
    const div = document.createElement('div');
    div.className = 'color-option';
    div.style.background = color;
    div.onclick = () => selectColor(color);
    picker.appendChild(div);
  });
}

function selectColor(color) {
  selectedColor = color;
  document.querySelectorAll('.color-option').forEach(el => {
    el.classList.toggle('selected', el.style.background === color);
  });
}

function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    uploadedAvatar = e.target.result;
    document.getElementById('profileAvatarImg').src = uploadedAvatar;
    document.getElementById('profileAvatarImg').style.display = 'block';
    document.getElementById('profileAvatarText').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function openProfile() {
  document.getElementById('profileModal').classList.add('show');
  document.getElementById('profileUsername').value = '@' + me;
  selectedColor = currentUser.avatarColor || "#667eea";
  uploadedAvatar = currentUser.avatar || null;
  
  if (uploadedAvatar) {
    document.getElementById('profileAvatarImg').src = uploadedAvatar;
    document.getElementById('profileAvatarImg').style.display = 'block';
    document.getElementById('profileAvatarText').style.display = 'none';
    document.getElementById('profileAvatarLarge').style.background = 'transparent';
  } else {
    document.getElementById('profileAvatarImg').style.display = 'none';
    document.getElementById('profileAvatarText').style.display = 'block';
    document.getElementById('profileAvatarText').textContent = getAvatarLetter(me);
    document.getElementById('profileAvatarLarge').style.background = selectedColor;
  }
  
  document.querySelectorAll('.color-option').forEach(el => {
    el.classList.toggle('selected', el.style.background === selectedColor);
  });
}

function closeProfile() {
  document.getElementById('profileModal').classList.remove('show');
}

async function saveProfile() {
  try {
    await fetch('/profile/update', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${userToken}`
      },
      body: JSON.stringify({ avatar: uploadedAvatar, avatarColor: selectedColor })
    });
    currentUser.avatar = uploadedAvatar;
    currentUser.avatarColor = selectedColor;
    updateMyAvatar();
    closeProfile();
    showNotification('Профиль обновлён', 'success');
  } catch (err) {
    showNotification('Ошибка обновления профиля', 'error');
  }
}

function updateMyAvatar() {
  const el = document.getElementById('myAvatar');
  if (currentUser.avatar) {
    el.style.backgroundImage = `url(${currentUser.avatar})`;
    el.style.backgroundSize = 'cover';
    el.textContent = '';
  } else {
    el.style.backgroundImage = 'none';
    el.style.background = currentUser.avatarColor || '#667eea';
    el.textContent = getAvatarLetter(me);
  }
}

// ========== Выход ==========
async function logout() {
  closeProfile();
  
  if (userToken) {
    try {
      await fetch('/logout', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${userToken}` }
      });
    } catch (err) {}
  }
  
  if (socket) socket.disconnect();
  
  localStorage.removeItem('qwas_token');
  localStorage.removeItem('qwas_user');
  
  me = "";
  current = "";
  userToken = "";
  chatList = [];
  allUsers = [];
  
  document.getElementById('auth').style.display = 'flex';
  document.getElementById('chat').style.display = 'none';
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('chatHeader').style.display = 'none';
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
  
  showNotification('Вы вышли из аккаунта', 'info');
}

// ========== Загрузка данных ==========
async function loadAllUsers() {
  try {
    const res = await fetch('/users/all', {
      headers: { 'Authorization': `Bearer ${userToken}` }
    });
    const data = await res.json();
    allUsers = data.ok ? data.users : [];
  } catch (err) {}
}

async function loadChatList() {
  try {
    const res = await fetch('/chats', {
      headers: { 'Authorization': `Bearer ${userToken}` }
    });
    const data = await res.json();
    chatList = data.chats || [];
    renderChatList();
  } catch (err) {}
}

function renderChatList() {
  const container = document.getElementById("users");
  
  if (chatList.length === 0) {
    container.innerHTML = '<div class="empty-state"><div>💭</div><p style="margin-top:8px;">Нет чатов</p></div>';
    return;
  }
  
  container.innerHTML = chatList.sort((a,b) => a.username.localeCompare(b.username)).map(u => `
    <div class="user ${current === u.username ? 'selected' : ''}" onclick="selectUser('${u.username}')">
      <div class="user-avatar small" style="background:${u.avatarColor || '#667eea'};">
        ${u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : getAvatarLetter(u.username)}
      </div>
      <div class="user-content">
        <div class="user-name">@${u.username}</div>
        <div class="user-status">${u.online?'Онлайн':'Офлайн'}</div>
      </div>
      <span class="${u.online?'online':'offline'}-indicator"></span>
    </div>
  `).join('');
}

// ========== Поиск ==========
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', function() {
  const query = this.value.trim();
  
  if (query.length === 0) {
    searchResults.style.display = 'none';
    return;
  }
  
  if (!Array.isArray(allUsers)) return;
  
  const cleanQuery = query.replace(/^@/, '').toLowerCase();
  
  const filtered = allUsers.filter(u => {
    if (!u || !u.username || u.username === me) return false;
    return u.username.toLowerCase().includes(cleanQuery);
  });
  
  if (filtered.length === 0) {
    searchResults.innerHTML = '<div style="padding:16px;text-align:center;color:#666;">Ничего не найдено</div>';
  } else {
    searchResults.innerHTML = filtered.slice(0, 10).map(u => `
      <div class="search-result-item" onclick="startChatWith('${u.username}')">
        <div class="user-avatar small" style="background:${u.avatarColor || '#667eea'};">
          ${u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : getAvatarLetter(u.username)}
        </div>
        <div>
          <div class="user-name">@${u.username}</div>
        </div>
      </div>
    `).join('');
  }
  
  searchResults.style.display = 'block';
});

searchInput.addEventListener('focus', () => {
  if (searchInput.value.trim().length > 0) {
    searchResults.style.display = 'block';
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-container')) {
    searchResults.style.display = 'none';
  }
});

function startChatWith(username) {
  searchInput.value = '';
  searchResults.style.display = 'none';
  
  if (!chatList.find(c => c.username === username)) {
    const user = allUsers.find(u => u.username === username);
    if (user) {
      chatList.push({ ...user, online: false });
      renderChatList();
    }
  }
  selectUser(username);
}

// ========== Чат ==========
function connectSocket(token) {
  socket = io({ auth: { token } });
  
  socket.on("chat_list", chats => {
    chatList = chats;
    renderChatList();
  });
  
  socket.on("new_message", msg => {
    if (msg.from === current || msg.to === current) {
      addMessageToChat(msg);
      if (msg.to === me) socket.emit("read", { from: msg.from, to: me });
    }
    loadChatList();
  });
  
  socket.on("chat_history", msgs => {
    const c = document.getElementById("messages");
    c.innerHTML = msgs.length ? '' : '<div class="empty-state"><div>💭</div><p>Нет сообщений</p></div>';
    msgs.forEach(m => addMessageToChat(m));
  });
  
  socket.on("read_update", data => {
    data.messages.forEach(id => {
      const el = document.getElementById(`msg-${id}`);
      if (el) {
        const status = el.querySelector('.message-status');
        if (status) status.textContent = '✓✓';
      }
    });
  });
  
  socket.on("typing", d => {
    if (d.from === current) document.getElementById('typingIndicator').textContent = `@${current} печатает...`;
  });
  
  socket.on("stop_typing", d => {
    if (d.from === current) document.getElementById('typingIndicator').textContent = '';
  });
}

function selectUser(username) {
  current = username;
  
  document.querySelectorAll('.user').forEach(el => {
    el.classList.remove('selected');
    if (el.querySelector('.user-name')?.textContent === '@' + username) {
      el.classList.add('selected');
    }
  });
  
  const user = chatList.find(u => u.username === username) || allUsers.find(u => u.username === username) || {};
  
  document.getElementById('chatHeader').style.display = 'flex';
  
  const avatarEl = document.getElementById('chatAvatar');
  avatarEl.style.background = user.avatarColor || '#667eea';
  if (user.avatar) {
    avatarEl.style.backgroundImage = `url(${user.avatar})`;
    avatarEl.style.backgroundSize = 'cover';
    avatarEl.textContent = '';
  } else {
    avatarEl.style.backgroundImage = 'none';
    avatarEl.textContent = getAvatarLetter(username);
  }
  
  document.getElementById('chatUsername').textContent = '@' + username;
  document.getElementById('chatStatus').textContent = user.online ? 'Онлайн' : 'Офлайн';
  document.getElementById('msg').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('typingIndicator').textContent = '';
  
  if (isMobile) {
    document.getElementById('sidebar').classList.add('hidden');
  }
  
  socket.emit("get_history", username);
}

function addMessageToChat(msg) {
  const c = document.getElementById("messages");
  if (c.children.length === 1 && c.children[0].classList.contains('empty-state')) c.innerHTML = '';
  if (document.getElementById(`msg-${msg._id}`)) return;
  
  const isMe = msg.from === me;
  
  const div = document.createElement("div");
  div.className = `message ${isMe ? 'me' : 'other'}`;
  div.id = `msg-${msg._id}`;
  
  div.innerHTML = `
    <div class="message-avatar" style="background:${isMe ? currentUser.avatarColor : '#667eea'};">
      ${getAvatarLetter(msg.from)}
    </div>
    <div class="message-content">
      <div class="message-bubble">${escapeHtml(msg.message)}</div>
      <div class="message-meta">
        <span>${new Date(msg.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
        ${isMe ? `<span class="message-status">${msg.status==='read'?'✓✓':'✓'}</span>` : ''}
      </div>
    </div>
  `;
  
  c.appendChild(div);
  c.scrollTop = c.scrollHeight;
}

function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text || !current) return;
  
  socket.emit("send_message", { to: current, message: text });
  input.value = "";
  input.focus();
}

function showSidebar() {
  document.getElementById('sidebar').classList.remove('hidden');
}

// ========== Обработчики ==========
document.getElementById("msg").addEventListener("keypress", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

document.getElementById("msg").addEventListener("input", () => {
  if (!current) return;
  socket.emit("typing", current);
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => socket.emit("stop_typing", current), 1000);
});

document.getElementById('avatarInput').addEventListener('change', handleAvatarUpload);

// Enter на странице входа
document.getElementById('loginPassword').addEventListener('keypress', e => {
  if (e.key === 'Enter') handleLogin();
});

// Enter в поле регистрации
document.getElementById('regConfirmPassword').addEventListener('keypress', e => {
  if (e.key === 'Enter') handleRegister();
});

// ========== Инициализация ==========
document.addEventListener('DOMContentLoaded', () => {
  initColorPicker();
  checkAutoLogin();
});

// Предотвращение жестов
document.addEventListener('touchmove', (e) => {
  if (e.target.closest('.messages-container') || e.target.closest('.users-list')) {
    return;
  }
}, { passive: false });

document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());
</script>
