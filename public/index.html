<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PRO STABLE 3.1</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0d0d0d;
    color:#fff;
}

#chat{display:none;height:100vh;}

.sidebar{
    width:280px;
    background:#111;
    border-right:1px solid #222;
    overflow:auto;
}

.user{
    padding:14px;
    border-bottom:1px solid #1f1f1f;
    cursor:pointer;
}

.user:hover{
    background:#1a1a1a;
}

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

.header{
    padding:15px;
    border-bottom:1px solid #222;
}

.messages{
    flex:1;
    padding:15px;
    overflow:auto;
}

.msg{
    margin:6px 0;
    max-width:70%;
    padding:10px;
    border-radius:10px;
}

.me{
    margin-left:auto;
    background:#fff;
    color:#000;
}

.other{
    background:#1a1a1a;
    border:1px solid #333;
}

.input{
    display:flex;
    border-top:1px solid #222;
}

input{
    flex:1;
    padding:14px;
    background:#111;
    border:none;
    color:#fff;
}

button{
    width:80px;
}
</style>
</head>

<body>

<div id="chat">

    <div class="sidebar" id="users"></div>

    <div class="chat">

        <div class="header" id="chatName"></div>

        <div class="messages" id="messages"></div>

        <div class="input">
            <input id="msg">
            <button onclick="send()">➤</button>
        </div>

    </div>
</div>

<script>
const socket=io();

let token="";
let username="";
let current="";

/* LOGIN AUTO */
username=prompt("username");

fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username,password:"123"})
})
.then(r=>r.json())
.then(d=>{

token=d.token;

chat.style.display="flex";

socket.io.opts.auth={token};
socket.connect();

});

/* USERS */
socket.on("users",data=>{
users.innerHTML="";

data.users.forEach(u=>{
if(u.username!==username){

users.innerHTML+=`
<div class="user" onclick="openChat('${u.username}')">
${u.username}
</div>`;
}
});
});

/* OPEN */
function openChat(u){
current=u;
chatName.innerText=u;
socket.emit("get_history",u);
}

/* SEND */
function send(){
if(!msg.value)return;

socket.emit("private_message",{
to:current,
message:msg.value
});

msg.value="";
}

/* RECEIVE */
socket.on("private_message",m=>{
if(m.from===current||m.from===username){
render(m);
}
});

/* HISTORY */
socket.on("chat_history",msgs=>{
messages.innerHTML="";
msgs.forEach(render);
});

/* RENDER */
function render(m){

let div=document.createElement("div");

div.className="msg "+(m.from===username?"me":"other");
div.innerText=m.message;

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;
}
</script>

</body>
</html>
