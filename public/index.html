<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-font-size="medium">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QWAS">
  <meta name="application-name" content="QWAS">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#17212b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="QWAS Messenger — современный мессенджер">
  <meta name="apple-itunes-app" content="app-id=XXXXXXXXX">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icon-120.png">
  <!-- iOS Splash screens (опционально, iOS использует background-color) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QWAS Messenger</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/css/vars.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/chat.css">
  <link rel="stylesheet" href="/css/messages.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/settings.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>

<div id="app">

  <!-- Экран авторизации -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-bg"></div>
    <div class="auth-container">
      <div class="auth-brand">
        <div class="auth-logo">
          <svg viewBox="0 0 100 100" width="64" height="64">
            <defs>
              <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#5e8ee7"/>
                <stop offset="100%" stop-color="#2a7ae0"/>
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="48" fill="url(#lg)"/>
            <path d="M30 30 L70 30 L70 50 Q70 70 50 70 Q30 70 30 50 Z" fill="white" opacity="0.95"/>
          </svg>
        </div>
        <h1>QWAS</h1>
        <p class="auth-tagline">Современный мессенджер</p>
      </div>

      <!-- Форма входа -->
      <div id="authLogin" class="auth-form">
        <h2>Вход</h2>
        <div class="auth-field">
          <input type="text" id="loginUsername" placeholder="Имя пользователя" autocomplete="username" autocapitalize="none" spellcheck="false">
        </div>
        <div class="auth-field">
          <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password">
          <button class="auth-eye" id="loginEye" type="button">👁</button>
        </div>
        <button class="btn-primary auth-btn" id="authLoginBtn" type="button">
          <span>Войти</span>
        </button>
        <button class="auth-link" id="authOpenRegister" type="button">Создать аккаунт</button>
        <div class="auth-version" id="authVersion">QWAS Messenger</div>
      </div>

      <!-- Форма регистрации -->
      <div id="authRegister" class="auth-form" style="display:none;">
        <h2>Регистрация</h2>
        <div class="auth-field" id="regUsernameField">
          <input type="text" id="regUsername" placeholder="Имя пользователя (a-z, 0-9, _)" autocomplete="off" autocapitalize="none" spellcheck="false" minlength="3" maxlength="32">
          <span class="field-status" id="regUsernameStatus"></span>
          <div class="field-hint" id="regUsernameHint">Только латиница, цифры и подчёркивание</div>
        </div>
        <div class="auth-field" id="regEmailField">
          <input type="email" id="regEmail" placeholder="Email" autocomplete="email" spellcheck="false" maxlength="254">
          <span class="field-status" id="regEmailStatus"></span>
          <div class="field-hint" id="regEmailHint">Для восстановления доступа</div>
        </div>
        <div class="auth-field-row">
          <div class="auth-field">
            <input type="text" id="regFirstName" placeholder="Имя" autocomplete="off" maxlength="64">
          </div>
          <div class="auth-field">
            <input type="text" id="regLastName" placeholder="Фамилия" autocomplete="off" maxlength="64">
          </div>
        </div>
        <div class="auth-field">
          <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)" autocomplete="new-password" minlength="6" maxlength="128">
        </div>
        <div class="auth-field">
          <input type="password" id="regConfirmPassword" placeholder="Подтвердите пароль" autocomplete="new-password" minlength="6" maxlength="128">
        </div>
        <div class="auth-error" id="regError" style="display:none;"></div>
        <button class="btn-primary auth-btn" id="authRegisterBtn" type="button" disabled>Создать аккаунт</button>
        <button class="auth-link" id="authCloseRegister" type="button">Уже есть аккаунт</button>
      </div>
    </div>
  </div>

  <!-- Главный экран -->
  <div id="mainScreen" class="main-screen" style="display:none;">

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-resizer" id="sidebarResizer" aria-hidden="true"></div>
      <header class="sidebar-header">
        <button class="icon-btn sidebar-menu" id="sidebarMenuBtn" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
        <div class="sidebar-search">
          <svg viewBox="0 0 24 24" width="18" height="18" class="search-icon"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zM9.5 14A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
          <input type="text" id="searchInput" placeholder="Поиск" autocomplete="off">
        </div>
      </header>

      <div id="foldersBar" class="folders-bar"></div>

      <div id="storiesRail" class="stories-rail"></div>

      <div class="chats-tabs">
        <button class="chats-tab active" data-tab="all" type="button">Все</button>
        <button class="chats-tab" data-tab="unread" type="button">Непрочитанные</button>
        <button class="chats-tab" data-tab="groups" type="button">Группы</button>
        <button class="chats-tab" data-tab="channels" type="button">Каналы</button>
        <button class="chats-tab" data-tab="contacts" type="button">Контакты</button>
      </div>

      <div class="chats-list-wrapper">
        <div class="chats-list" id="chatsList"></div>
        <div class="chats-empty" id="chatsEmpty" style="display:none;">
          <div class="chats-empty-icon">💬</div>
          <h3>Нет чатов</h3>
          <p>Начните общение — найдите собеседника или создайте группу</p>
          <button class="btn-primary" id="emptyChatNewChatBtn" type="button">Новый чат</button>
        </div>
      </div>

      <button class="fab" id="fabNewChat" type="button" title="Новый чат">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
      </button>
    </aside>

    <main id="chatArea" class="chat-area" data-empty="true">
      <div class="swipe-back-hint" id="swipeBackHint"></div>

      <div class="empty-chat" id="emptyChat">
        <div class="empty-chat-bg"></div>
        <div class="empty-chat-content">
          <div class="empty-chat-icon">
            <svg viewBox="0 0 100 100" width="120" height="120">
              <defs>
                <linearGradient id="emptyLg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#5e8ee7"/>
                  <stop offset="100%" stop-color="#2a7ae0"/>
                </linearGradient>
              </defs>
              <circle cx="50" cy="50" r="48" fill="url(#emptyLg)" opacity="0.15"/>
              <path d="M20 35 Q20 25 30 25 L70 25 Q80 25 80 35 L80 60 Q80 70 70 70 L40 70 L25 80 L30 70 Q20 70 20 60 Z" fill="url(#emptyLg)" opacity="0.6"/>
            </svg>
          </div>
          <h2>QWAS Messenger</h2>
          <p>Выберите чат, чтобы начать общение</p>
        </div>
      </div>

      <div class="chat-content" id="chatContent" style="display:none;">

        <header class="chat-header" id="chatHeader">
          <button class="icon-btn chat-back" id="chatBackBtn" type="button">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
          </button>
          <div class="chat-header-info" id="chatHeaderInfo">
            <div class="chat-avatar" id="chatAvatar"></div>
            <div class="chat-header-text">
              <div class="chat-title" id="chatTitle">Имя</div>
              <div class="chat-subtitle" id="chatSubtitle"></div>
            </div>
          </div>
          <div class="chat-header-actions">
            <button class="icon-btn" id="chatVoiceCallBtn" type="button" title="Аудиозвонок">
              <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 15.5c-1.25 0-2.45-.2-3.57-.57a1 1 0 0 0-1.02.24l-2.2 2.2a15.05 15.05 0 0 1-6.59-6.58l2.2-2.21a1 1 0 0 0 .25-1A11.36 11.36 0 0 1 8.5 4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1c0 9.39 7.61 17 17 17a1 1 0 0 0 1-1v-3.5a1 1 0 0 0-1-1"/></svg>
            </button>
            <button class="icon-btn" id="chatVideoCallBtn" type="button" title="Видеозвонок">
              <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z"/></svg>
            </button>
            <button class="icon-btn" id="chatSearchBtn" type="button" title="Поиск в чате">
              <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zM9.5 14A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
            </button>
            <button class="icon-btn" id="chatInfoBtn" type="button" title="Информация">
              <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4m0 6a4 4 0 1 1 0-8 4 4 0 0 1 0 8m9-2a8 8 0 0 1-13.2 6.13L4 19l1.13-3.81A8 8 0 1 1 21 12"/></svg>
            </button>
          </div>
        </header>

        <div class="pinned-bar" id="pinnedBar" style="display:none;">
          <span class="pinned-bar-icon" id="pinnedBarIcon"></span>
          <div class="pinned-bar-content" id="pinnedBarContent">
            <div class="pinned-bar-label">Закреплённое сообщение</div>
            <div class="pinned-bar-body">
              <span class="pinned-author"></span>
              <span class="pinned-preview"></span>
            </div>
          </div>
          <button class="icon-btn pinned-bar-action" id="pinnedBarAction" type="button" title="Перейти">
            <span id="pinnedBarActionIcon"></span>
          </button>
          <button class="icon-btn pinned-bar-close" id="pinnedBarClose" type="button" title="Открепить">
            <span id="pinnedBarCloseIcon"></span>
          </button>
        </div>

        <div class="messages-wrapper" id="messagesWrapper">
          <div class="chat-bg" id="chatBg"></div>
          <div class="messages" id="messages"></div>
          <div class="scroll-anchor" id="scrollAnchor"></div>
          <div class="scroll-to-bottom" id="scrollToBottom" style="display:none;">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
          </div>
        </div>

        <div class="typing-indicator" id="typingIndicator" style="display:none;">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
          <span class="typing-text" id="typingText">печатает...</span>
        </div>

        <div class="reply-preview" id="replyPreview" style="display:none;">
          <div class="reply-content">
            <div class="reply-author" id="replyAuthor"></div>
            <div class="reply-text" id="replyText"></div>
          </div>
          <button class="icon-btn" id="replyCancel" type="button">✕</button>
        </div>

        <!-- Композер -->
        <div class="composer" id="composer">
          <button class="icon-btn composer-btn" id="attachBtn" type="button" title="Прикрепить">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M16.5 6v11.5a4 4 0 1 1-4-4v2.5a1.5 1.5 0 1 0 1.5 1.5V6a3 3 0 1 0-3 3v8.5a5.5 5.5 0 1 0 5.5-5.5z"/></svg>
          </button>
          <button class="icon-btn composer-btn" id="emojiBtn" type="button" title="Эмодзи">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2M12 20a8 8 0 1 1 0-16 8 8 0 0 1 0 16m3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5m-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11m3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5"/></svg>
          </button>
          <div class="composer-input">
            <textarea id="msgInput" placeholder="Сообщение" rows="1"></textarea>
          </div>
          <button class="icon-btn composer-btn round-btn" id="roundBtn" type="button" title="Видеосообщение">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2m0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8m0-13a5 5 0 1 0 5 5 5 5 0 0 0-5-5m-2 5l4-2.5v5z"/></svg>
          </button>
          <button class="icon-btn composer-btn record-btn" id="recordBtn" data-mode="voice" type="button" title="Удерживайте для записи голоса">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3m5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
          </button>
          <button class="icon-btn send-btn" id="sendBtn" type="button" style="display:none;" title="Отправить">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg>
          </button>

          <!-- Меню вложений (внутри композера для правильного позиционирования) -->
          <div class="attach-menu" id="attachMenu" style="display:none;">
            <button class="attach-item" id="attach-photo" type="button">
              <span class="attach-icon icon-blue"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2M8.5 13.5l2.5 3.01L14.5 12l4.5 6H5z"/></svg></span>
              <span>Фото</span>
            </button>
            <button class="attach-item" id="attach-video" type="button">
              <span class="attach-icon icon-violet"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z"/></svg></span>
              <span>Видео</span>
            </button>
            <button class="attach-item" id="attach-file" type="button">
              <span class="attach-icon icon-cyan"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 7V3.5L18.5 9z"/></svg></span>
              <span>Файл</span>
            </button>
            <button class="attach-item" id="attach-audio" type="button">
              <span class="attach-icon icon-green"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg></span>
              <span>Музыка</span>
            </button>
            <button class="attach-item" id="attach-location" type="button">
              <span class="attach-icon icon-orange"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a8 8 0 0 0-8 8c0 5.4 7.05 11.5 7.35 11.76a1 1 0 0 0 1.3 0C12.95 21.5 20 15.4 20 10a8 8 0 0 0-8-8m0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/></svg></span>
              <span>Геопозиция</span>
            </button>
            <button class="attach-item" id="attach-contact" type="button">
              <span class="attach-icon icon-yellow"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 0H4v2h16zM4 24h16v-2H4zm5-3h6v-1.5a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2zm3-7a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/></svg></span>
              <span>Контакт</span>
            </button>
            <button class="attach-item" id="attach-poll" type="button">
              <span class="attach-icon icon-red"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 13h2v-2H3zm0 4h2v-2H3zm0-8h2V7H3zm4 4h14v-2H7zm0 4h14v-2H7zM7 7v2h14V7z"/></svg></span>
              <span>Опрос</span>
            </button>
          </div>

          <!-- Панель эмодзи (внутри композера) -->
          <div class="emoji-panel" id="emojiPanel" style="display:none;">
            <div class="emoji-panel-header">
              <input type="text" id="emojiSearch" placeholder="Поиск эмодзи..." />
              <div class="emoji-skin-tones" id="emojiSkinTones"></div>
            </div>
            <div class="emoji-categories" id="emojiCategories"></div>
            <div class="emoji-grid" id="emojiGrid"></div>
          </div>
        </div>

        <!-- Запись голоса (внутри chat-content, выше композера) -->
        <div class="voice-recording" id="voiceRecording" style="display:none;">
          <button class="icon-btn voice-cancel" id="voiceCancelBtn" type="button">✕</button>
          <div class="voice-wave" id="voiceWave">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="voice-timer" id="voiceTimer">0:00</div>
          <button class="icon-btn voice-send" id="voiceSendBtn" type="button" title="Отправить">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg>
          </button>
        </div>

      </div>
    </main>

    <aside id="rightPanel" class="right-panel">
      <div class="right-panel-resizer" id="rightPanelResizer" aria-hidden="true"></div>
      <div id="rightPanelContent" class="right-panel-content"></div>
    </aside>

  </div>

</div>

<div id="toastContainer" class="toast-container"></div>
<div id="modalContainer"></div>

<!-- Mobile bottom nav (visible only on phones) -->
<nav id="mobileNav" class="mobile-nav">
  <button class="mobile-nav-btn active" data-nav="chats" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Чаты</span>
  </button>
  <button class="mobile-nav-btn" data-nav="contacts" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span>Контакты</span>
  </button>
