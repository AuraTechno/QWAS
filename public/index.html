<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Messenger FIX</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0d0d0d;
    color:#fff;
}

#auth{
    width:320px;
    margin:120px auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input{
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1a1a1a;
    color:#fff;
}

button{
    padding:12px;
    border:none;
    border-radius:10px;
    background:#fff;
    color:#000;
    cursor:pointer;
}

#chat{
    display:none;
    height:100vh;
}

/* LEFT USERS */
.sidebar{
    width:280px;
    background:#111;
    border-right:1px solid #222;
    overflow:auto;
}

.user{
    padding:14px;
    border-bottom:1px solid #1f1f1f;
    cursor:pointer;
}

/* CHAT */
.chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

.header{
    padding:15px;
    border-bottom:1px solid #222;
}

.messages{
    flex:1;
    padding:15px;
    overflow:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.msg{
    max-width:70%;
    padding:10px;
    border-radius:10px;
}

.me{
    align-self:flex-end;
    background:#fff;
    color:#000;
}

.other{
    background:#1a1a1a;
    border:1px solid #333;
}

.input{
    display:flex;
    border-top:1px solid #222;
}

.input input{
    flex:1;
}

.input button{
    width:80px;
}
</style>
</head>

<body>

<div id="auth">
    <input id="u" placeholder="username">
    <input id="p" type="password" placeholder="password">

    <button onclick="login()">Войти</button>
    <button onclick="register()">Регистрация</button>
</div>

<div id="chat">

    <div class="sidebar" id="users"></div>

    <div class="chat">

        <div class="header" id="chatName">Chat</div>

        <div class="messages" id="messages"></div>

        <div class="input">
            <input id="msg">
            <button onclick="send()">➤</button>
        </div>

    </div>
</div>

<script>
let socket;
let token="";
let username="";
let current="";

/* REGISTER */
function register(){
fetch("/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u.value,password:p.value})
});
}

/* LOGIN */
function login(){
fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u.value,password:p.value})
})
.then(r=>r.json())
.then(d=>{

if(!d.ok){
alert("error");
return;
}

token=d.token;
username=u.value;

/* UI SWITCH */
auth.style.display="none";
chat.style.display="flex";

/* SOCKET INIT — ВАЖНО */
socket = io({
auth:{token}
});

/* СТАБИЛЬНЫЙ CONNECT */
socket.on("connect",()=>{
socket.emit("join");
});

/* USERS */
socket.on("users",data=>{

users.innerHTML="";

data.users.forEach(u=>{
if(u.username!==username){
users.innerHTML+=`
<div class="user" onclick="openChat('${u.username}')">
${u.username}
</div>`;
}
});

});

socket.on("private_message",m=>{
if(m.from===current||m.from===username){
render(m);
}
});

socket.on("chat_history",msgs=>{
messages.innerHTML="";
msgs.forEach(render);
});

});
}

/* OPEN CHAT */
function openChat(u){
current=u;
chatName.innerText=u;
socket.emit("get_history",u);
}

/* SEND */
function send(){
if(!msg.value)return;

socket.emit("private_message",{
to:current,
message:msg.value
});

msg.value="";
}

/* RENDER */
function render(m){

let div=document.createElement("div");
div.className="msg "+(m.from===username?"me":"other");
div.innerText=m.message;

messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
}
</script>

</body>
</html>
