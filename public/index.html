<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>E2E Messenger</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0d0d0d;
color:#fff;
}

#auth{
width:320px;
margin:120px auto;
display:flex;
flex-direction:column;
gap:10px;
}

input{
padding:12px;
border:none;
border-radius:10px;
background:#1a1a1a;
color:#fff;
}

button{
padding:12px;
border:none;
border-radius:10px;
background:#fff;
color:#000;
cursor:pointer;
}

#chat{
display:none;
height:100vh;
}

.sidebar{
width:280px;
background:#111;
border-right:1px solid #222;
overflow:auto;
}

.user{
padding:14px;
border-bottom:1px solid #1f1f1f;
cursor:pointer;
}

.chat{
flex:1;
display:flex;
flex-direction:column;
}

.header{
padding:15px;
border-bottom:1px solid #222;
}

.messages{
flex:1;
padding:15px;
overflow:auto;
display:flex;
flex-direction:column;
gap:8px;
}

.msg{
max-width:70%;
padding:10px;
border-radius:10px;
}

.me{
align-self:flex-end;
background:#fff;
color:#000;
}

.other{
background:#1a1a1a;
border:1px solid #333;
}

.input{
display:flex;
border-top:1px solid #222;
}

input.msg{
flex:1;
padding:14px;
}
</style>
</head>

<body>

<div id="auth">
<input id="u" placeholder="username">
<input id="p" type="password" placeholder="password">
<button onclick="login()">Войти</button>
<button onclick="register()">Регистрация</button>
</div>

<div id="chat">

<div class="sidebar" id="users"></div>

<div class="chat">

<div class="header" id="chatName">Chat</div>

<div class="messages" id="messages"></div>

<div class="input">
<input id="msg" class="msg">
<button onclick="send()">➤</button>
</div>

</div>

</div>

<script>

let socket;
let token="";
let username="";
let current="";

/* KEY */
function getKey(a,b){
return CryptoJS.SHA256([a,b].sort().join("-")).toString();
}

/* ENCRYPT */
function enc(text,key){
return CryptoJS.AES.encrypt(text,key).toString();
}

/* DECRYPT */
function dec(text,key){
let bytes=CryptoJS.AES.decrypt(text,key);
return bytes.toString(CryptoJS.enc.Utf8);
}

/* LOGIN */
function login(){
fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u.value,password:p.value})
})
.then(r=>r.json())
.then(d=>{

if(!d.ok) return alert("error");

token=d.token;
username=u.value;

auth.style.display="none";
chat.style.display="flex";

socket=io({auth:{token}});

socket.on("connect",()=>{
socket.emit("join");
});

socket.on("users",d=>{
users.innerHTML="";
d.users.forEach(u=>{
if(u.username!==username){
users.innerHTML+=`
<div class="user" onclick="openChat('${u.username}')">
${u.username}
</div>`;
}
});
});

socket.on("private_message",render);

socket.on("chat_history",msgs=>{
messages.innerHTML="";
msgs.forEach(render);
});

});
}

/* REGISTER */
function register(){
fetch("/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u.value,password:p.value})
});
}

/* CHAT */
function openChat(u){
current=u;
chatName.innerText=u;
socket.emit("get_history",u);
}

/* SEND (ENCRYPTED) */
function send(){

if(!msg.value)return;

let key=getKey(username,current);

socket.emit("private_message",{
to:current,
message:enc(msg.value,key)
});

msg.value="";
}

/* RENDER (DECRYPT) */
function render(m){

let key=getKey(username,m.from===username?m.to:m.from);

let text=dec(m.message,key);

let div=document.createElement("div");
div.className="msg "+(m.from===username?"me":"other");
div.innerText=text;

messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
}

</script>

</body>
</html>
