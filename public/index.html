<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Messenger FIX</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff}
#auth{width:300px;margin:100px auto;display:flex;flex-direction:column;gap:10px}
input,button{padding:12px;border-radius:8px;border:none}
button{background:#fff;font-weight:bold}
#chat{display:none;height:100vh}
.sidebar{width:250px;background:#000;overflow:auto}
.user{padding:10px;border-bottom:1px solid #222;cursor:pointer;display:flex;align-items:center;gap:8px}
.user .online-dot{width:10px;height:10px;border-radius:50%;background:#00ff00}
.user .offline-dot{width:10px;height:10px;border-radius:50%;background:#666}
.chat{flex:1;display:flex;flex-direction:column}
.header{padding:10px;background:#000}
.messages{flex:1;padding:10px;overflow:auto;display:flex;flex-direction:column}
.msg{padding:10px;margin:5px;border-radius:8px;max-width:70%;word-break:break-word}
.me{background:#fff;color:#000;align-self:flex-end}
.other{background:#222;align-self:flex-start}
.meta{font-size:10px;opacity:.7;margin-top:4px}
.input{display:flex}
.input input{flex:1}
.input button{width:60px}
.typing-indicator{font-size:12px;color:#aaa;padding:4px 10px}
</style>
</head>

<body>

<div id="auth">
<input id="u" placeholder="username">
<input id="p" type="password">
<button onclick="login()">login</button>
<button onclick="register()">register</button>
</div>

<div id="chat">

<div class="sidebar" id="users"></div>

<div class="chat">

<div class="header" id="title">Выберите чат</div>

<div class="messages" id="messages"></div>

<div id="typingIndicator" class="typing-indicator"></div>

<div class="input">
<input id="msg" placeholder="Сообщение..." disabled>
<button id="sendBtn" onclick="send()" disabled>➤</button>
</div>

</div>

</div>

<script>

let socket;
let me = "";
let current = "";
let typingTimeout = null;

const map = new Map();

/* === AUTH === */
function register() {
  fetch("/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: u.value, password: p.value })
  })
  .then(r => r.json())
  .then(d => {
    alert(d.ok ? "ok" : "error");
  });
}

function login() {
  fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: u.value, password: p.value })
  })
  .then(r => r.json())
  .then(d => {
    if (!d.ok) return alert("error");
    me = u.value;
    auth.style.display = "none";
    chat.style.display = "flex";
    connectSocket(d.token);
  });
}

/* === SOCKET === */
function connectSocket(token) {
  socket = io({ auth: { token } });

  socket.on("connect", () => {
    console.log("connected");
  });

  socket.on("users", users => {
    renderUsers(users);
  });

  socket.on("new_message", msg => {
    const isFromCurrent = (msg.from === current || msg.to === current);
    if (isFromCurrent) {
      addMessageToChat(msg);
      if (msg.to === me && current === msg.from) {
        socket.emit("read", { from: msg.from, to: me });
      }
    }
  });

  socket.on("chat_history", msgs => {
    renderHistory(msgs);
  });

  socket.on("read_update", data => {
    data.messages.forEach(id => {
      const el = document.getElementById(`msg-${id}`);
      if (el) {
        const statusEl = el.querySelector('.status');
        if (statusEl) statusEl.innerText = '✓✓';
      }
    });
  });

  socket.on("typing", data => {
    if (data.from === current) {
      typingIndicator.innerText = `${current} печатает...`;
    }
  });

  socket.on("stop_typing", data => {
    if (data.from === current) {
      typingIndicator.innerText = "";
    }
  });

  socket.on("disconnect", () => {});
}

/* === RENDER USERS === */
function renderUsers(users) {
  const container = document.getElementById("users");
  container.innerHTML = "";
  users.filter(u => u.username !== me).forEach(u => {
    const div = document.createElement("div");
    div.className = "user";
    div.onclick = () => selectUser(u.username);

    const dot = document.createElement("span");
    dot.className = u.online ? "online-dot" : "offline-dot";
    div.appendChild(dot);

    const name = document.createElement("span");
    name.innerText = u.username;
    div.appendChild(name);

    container.appendChild(div);
  });
}

/* === SELECT USER === */
function selectUser(username) {
  current = username;
  document.getElementById("title").innerText = `Чат с ${username}`;
  document.getElementById("msg").disabled = false;
  document.getElementById("sendBtn").disabled = false;
  document.getElementById("messages").innerHTML = "";
  typingIndicator.innerText = "";

  socket.emit("get_history", username);
}

/* === RENDER HISTORY === */
function renderHistory(msgs) {
  const container = document.getElementById("messages");
  container.innerHTML = "";
  msgs.forEach(msg => addMessageToChat(msg));
  scrollToBottom();
}

function addMessageToChat(msg) {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = `msg ${msg.from === me ? "me" : "other"}`;
  div.id = `msg-${msg._id}`;

  const text = document.createElement("div");
  text.innerText = msg.message;

  const meta = document.createElement("div");
  meta.className = "meta";

  const time = new Date(msg.createdAt).toLocaleTimeString().slice(0,5);
  const status = msg.status === "read" ? "✓✓" : (msg.from === me ? "✓" : "");
  meta.innerText = `${time} ${status}`;

  div.appendChild(text);
  div.appendChild(meta);
  container.appendChild(div);

  if (msg.from === current || msg.to === current) {
    scrollToBottom();
  }
}

function scrollToBottom() {
  const container = document.getElementById("messages");
  container.scrollTop = container.scrollHeight;
}

/* === SEND === */
function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text || !current) return;
  socket.emit("send_message", { to: current, message: text });
  input.value = "";
  socket.emit("stop_typing", current);
  if (typingTimeout) clearTimeout(typingTimeout);
}

/* === TYPING === */
document.getElementById("msg").addEventListener("input", () => {
  if (!current) return;
  socket.emit("typing", current);
  if (typingTimeout) clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    socket.emit("stop_typing", current);
  }, 1000);
});

/* === ENTER KEY === */
document.getElementById("msg").addEventListener("keypress", e => {
  if (e.key === "Enter") send();
});

</script>

</body>
</html>
