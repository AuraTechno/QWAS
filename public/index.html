<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Messenger FIX STABLE</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0d0d0d;
color:#fff;
}

/* AUTH */
#auth{
width:340px;
margin:120px auto;
display:flex;
flex-direction:column;
gap:12px;
text-align:center;
}

#auth div{
font-size:18px;
font-weight:bold;
}

#auth input{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:#1a1a1a;
color:#fff;
outline:none;
box-sizing:border-box;
}

#auth button{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:#fff;
color:#000;
font-weight:bold;
cursor:pointer;
}

/* CHAT */
#chat{
display:none;
height:100vh;
}

/* USERS */
.sidebar{
width:280px;
background:#111;
border-right:1px solid #222;
overflow:auto;
}

.chat{
flex:1;
display:flex;
flex-direction:column;
}

.header{
padding:15px;
border-bottom:1px solid #222;
}

.messages{
flex:1;
padding:15px;
overflow:auto;
display:flex;
flex-direction:column;
gap:8px;
}

.msg{
max-width:70%;
padding:10px 12px;
border-radius:14px;
word-wrap:break-word;
animation:pop .15s ease;
}

@keyframes pop{
from{transform:scale(0.95);opacity:0}
to{transform:scale(1);opacity:1}
}

.me{
align-self:flex-end;
background:#fff;
color:#000;
}

.other{
align-self:flex-start;
background:#1a1a1a;
border:1px solid #333;
}

.meta{
font-size:10px;
opacity:0.7;
text-align:right;
margin-top:4px;
}

/* INPUT FIX */
.input{
display:flex;
align-items:center;
padding:10px;
gap:8px;
border-top:1px solid #222;
background:#0f0f0f;
}

.input input{
flex:1;
padding:12px 14px;
border-radius:12px;
border:none;
background:#1a1a1a;
color:#fff;
outline:none;
}

.input button{
width:48px;
height:42px;
border-radius:12px;
border:none;
background:#fff;
color:#000;
cursor:pointer;
font-weight:bold;
}

</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
<div>Messenger FIX</div>
<input id="u" placeholder="username">
<input id="p" type="password">
<button onclick="login()">Войти</button>
<button onclick="register()">Регистрация</button>
</div>

<!-- CHAT -->
<div id="chat">

<div class="sidebar" id="users"></div>

<div class="chat">

<div class="header" id="chatName">Chat</div>

<div class="messages" id="messages"></div>

<div class="input">
<input id="msg" oninput="typing()">
<button onclick="send()">➤</button>
</div>

</div>

</div>

<script>

let socket = null;
let token = "";
let username = "";
let current = "";

/* KEY */
function key(a,b){
return CryptoJS.SHA256([a,b].sort().join("-")).toString();
}

function enc(t,k){
return CryptoJS.AES.encrypt(t,k).toString();
}

function dec(t,k){
return CryptoJS.AES.decrypt(t,k).toString(CryptoJS.enc.Utf8);
}

/* ===================== LOGIN FIX ===================== */
function login(){

fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:u.value,
password:p.value
})
})
.then(r=>r.json())
.then(d=>{

if(!d.ok){
alert("Ошибка входа");
return;
}

token = d.token;
username = u.value;

/* 🔥 UI SWITCH */
auth.style.display = "none";
chat.style.display = "flex";

/* 🔥 SOCKET SAFE INIT */
if(socket){
socket.disconnect();
socket = null;
}

socket = io({
auth:{ token },
transports:["websocket"]
});

/* CONNECT */
socket.on("connect",()=>{
console.log("connected");
socket.emit("join");
});

/* USERS */
socket.on("users",data=>{
users.innerHTML="";

data.forEach(u=>{
if(u.username !== username){
users.innerHTML += `
<div onclick="openChat('${u.username}')">
${u.username}
</div>`;
}
});

});

/* CHAT */
socket.on("private_message",render);

socket.on("chat_history",m=>{
messages.innerHTML="";
m.forEach(render);
});

/* TYPING */
socket.on("typing",d=>{
chatName.innerText = d.from + " печатает...";
});

socket.on("stop_typing",()=>{
chatName.innerText = current;
});

/* READ FIX */
socket.on("read_update",data=>{
document.querySelectorAll(".msg").forEach(el=>{
if(el.dataset.me==="1"){
el.querySelector(".meta").innerText="✔✔";
}
});
});

});
}

/* REGISTER */
function register(){
fetch("/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:u.value,
password:p.value
})
});
}

/* CHAT OPEN */
function openChat(u){

current = u;
chatName.innerText = u;

if(!socket) return;

socket.emit("get_history",u);

socket.emit("read",{
from:u,
to:username
});
}

/* SEND */
function send(){

if(!msg.value || !current) return;

let k = key(username,current);

socket.emit("private_message",{
to:current,
message:enc(msg.value,k)
});

msg.value = "";
}

/* TYPING */
let typingTimer;

function typing(){
if(!current) return;

socket.emit("typing",current);

clearTimeout(typingTimer);

typingTimer = setTimeout(()=>{
socket.emit("stop_typing",current);
},600);
}

/* RENDER */
function render(m){

let k = key(username,m.from===username?m.to:m.from);

let text="";
try{
text = dec(m.message,k);
}catch{
text="🔒";
}

let div = document.createElement("div");

div.className = "msg " + (m.from===username?"me":"other");

/* mark own messages */
if(m.from===username){
div.dataset.me = "1";
}

div.innerHTML = `
<div>${text}</div>
<div class="meta">${m.status==="read"?"✔✔":"✔"}</div>
`;

messages.appendChild(div);
messages.scrollTop = messages.scrollHeight;
}

</script>

</body>
</html>
