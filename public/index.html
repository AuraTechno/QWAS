<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PRO STABLE 6.1</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0d0d0d;
color:#fff;
}

/* AUTH */
#auth{
width:320px;
margin:120px auto;
display:flex;
flex-direction:column;
gap:10px;
}

/* CHAT */
#chat{
display:none;
height:100vh;
}

/* USERS */
.sidebar{
width:280px;
background:#111;
border-right:1px solid #222;
overflow:auto;
}

.user{
display:flex;
gap:10px;
padding:12px;
border-bottom:1px solid #1f1f1f;
cursor:pointer;
align-items:center;
}

.avatar{
width:35px;
height:35px;
border-radius:50%;
background:#333;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:14px;
}

.avatar img{
width:100%;
height:100%;
}

/* CHAT */
.chat{
flex:1;
display:flex;
flex-direction:column;
}

.header{
padding:15px;
border-bottom:1px solid #222;
}

.messages{
flex:1;
padding:15px;
overflow:auto;
display:flex;
flex-direction:column;
gap:8px;
}

.msg{
max-width:70%;
padding:10px;
border-radius:10px;
}

.me{
align-self:flex-end;
background:#fff;
color:#000;
}

.other{
background:#1a1a1a;
border:1px solid #333;
}

.meta{
font-size:10px;
opacity:0.6;
}

.input{
display:flex;
border-top:1px solid #222;
}

input{
flex:1;
padding:14px;
background:#111;
color:#fff;
border:none;
}

button{
width:80px;
}
</style>
</head>

<body>

<div id="auth">
<input id="u" placeholder="username">
<input id="p" type="password">
<button onclick="login()">Войти</button>
<button onclick="register()">Регистрация</button>
</div>

<div id="chat">

<div class="sidebar" id="users"></div>

<div class="chat">

<div class="header" id="chatName">Chat</div>

<div class="messages" id="messages"></div>

<div class="input">
<input id="msg" oninput="typing()">
<button onclick="send()">➤</button>
</div>

</div>

</div>

<script>

let socket;
let token="";
let username="";
let current="";

/* KEY */
function key(a,b){
return CryptoJS.SHA256([a,b].sort().join("-")).toString();
}

/* ENC */
function enc(t,k){
return CryptoJS.AES.encrypt(t,k).toString();
}

/* DEC */
function dec(t,k){
let b=CryptoJS.AES.decrypt(t,k);
return b.toString(CryptoJS.enc.Utf8);
}

/* LOGIN */
function login(){
fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u.value,password:p.value})
})
.then(r=>r.json())
.then(d=>{

if(!d.ok) return alert("error");

token=d.token;
username=u.value;

auth.style.display="none";
chat.style.display="flex";

socket=io({auth:{token}});

socket.on("connect",()=>socket.emit("join"));

socket.on("users",data=>{
users.innerHTML="";
data.forEach(u=>{
if(u.username!==username){

let av=u.avatar
?`<img src="${u.avatar}">`
:u.username[0];

let st=u.online?"🟢":"⚪";

users.innerHTML+=`
<div class="user" onclick="openChat('${u.username}')">
<div class="avatar">${av}</div>
<div>
<div>${u.username}</div>
<div style="font-size:10px">${st}</div>
</div>
</div>`;
}
});
});

socket.on("private_message",render);
socket.on("chat_history",m=>{
messages.innerHTML="";
m.forEach(render);
});

});
}

/* REGISTER */
function register(){
fetch("/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u.value,password:p.value})
});
}

/* CHAT */
function openChat(u){
current=u;
chatName.innerText=u;
socket.emit("get_history",u);
}

/* SEND E2E */
function send(){

if(!msg.value||!current)return;

let k=key(username,current);

socket.emit("private_message",{
to:current,
message:enc(msg.value,k)
});

msg.value="";
}

/* RENDER E2E */
function render(m){

let k=key(username,m.from===username?m.to:m.from);

let text="";
try{ text=dec(m.message,k); }
catch{ text="🔒 encrypted"; }

let div=document.createElement("div");
div.className="msg "+(m.from===username?"me":"other");

div.innerHTML=`
${text}
<div class="meta">${m.status}</div>
`;

messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
}

function typing(){
socket.emit("typing",current);
}

</script>

</body>
</html>
