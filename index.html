<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>QWAS</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0d0d0d;
    color:#fff;
}

#auth{
    width:320px;
    margin:120px auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input{
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1a1a1a;
    color:#fff;
}

button{
    padding:12px;
    border:none;
    border-radius:10px;
    background:#fff;
    color:#000;
}

#chat{display:none;height:100vh;}

.sidebar{
    width:300px;
    background:#121212;
    border-right:1px solid #222;
    overflow:auto;
}

.user{
    display:flex;
    gap:10px;
    padding:15px;
    cursor:pointer;
    border-bottom:1px solid #1f1f1f;
}

.avatar{
    width:40px;height:40px;border-radius:50%;
    background:#333;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.avatar img{width:100%;height:100%;}

.chat{flex:1;display:flex;flex-direction:column;}

.header{
    padding:15px;
    border-bottom:1px solid #222;
}

.status{
    font-size:12px;
    opacity:0.7;
}

.messages{flex:1;padding:15px;overflow:auto;}

.msg{display:flex;margin:6px 0;}
.me{justify-content:flex-end;}
.other{justify-content:flex-start;}

.bubble{
    max-width:60%;
    padding:10px;
    border-radius:12px;
}

.me .bubble{background:#fff;color:#000;}
.other .bubble{background:#1a1a1a;border:1px solid #333;}

.input{display:flex;border-top:1px solid #222;}
.input input{flex:1;padding:15px;background:#111;border:none;}
.input button{width:80px;}
</style>
</head>

<body>

<div id="auth">
    <input id="u">
    <input id="p" type="password">
    <button onclick="login()">Login</button>
</div>

<div id="chat">
    <div class="sidebar" id="users"></div>

    <div class="chat">
        <div class="header">
            <div id="chatName"></div>
            <div class="status" id="status"></div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input">
            <input id="msg">
            <button onclick="send()">➤</button>
        </div>
    </div>
</div>

<script>
const socket=io();

let username="";
let current="";

/* LOGIN */
function login(){
fetch("/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})})
.then(r=>r.json()).then(d=>{
if(d.ok){
username=u.value;
auth.style.display="none";
chat.style.display="flex";
socket.emit("join",username);
}
});
}

/* STATUS FIX */
function getStatus(user,data){

    if(data.online.includes(user)){
        return {text:"в сети",color:"#0f0"};
    }

    let u = data.users.find(x=>x.username===user);

    if(u && u.lastSeen){
        let diff = Date.now() - u.lastSeen;

        if(diff < 5*60*1000){
            return {text:"был недавно",color:"#aaa"};
        }
    }

    return {text:"оффлайн",color:"#555"};
}

/* USERS */
socket.on("users",data=>{
users.innerHTML="";

data.users.forEach(u=>{
if(u.username!==username){

let st=getStatus(u.username,data);

users.innerHTML+=`
<div class="user" onclick="openChat('${u.username}')">
<div class="avatar">${u.avatar?`<img src="${u.avatar}">`:u.username[0]}</div>
<div>
<div>${u.username}</div>
<div style="font-size:12px;color:${st.color}">
${st.text}
</div>
</div>
</div>`;
}
});
});

/* OPEN CHAT */
function openChat(u){
current=u;
chatName.innerText=u;
socket.emit("get_history",u);
}

/* SEND */
function send(){
if(!msg.value)return;

socket.emit("private_message",{to:current,message:msg.value});
msg.value="";
}

/* RECEIVE */
socket.on("private_message",m=>{
if(m.from===current||m.from===username){
render(m);
}
});

/* RENDER */
function render(m){
let me=m.from===username;

messages.innerHTML+=`
<div class="msg ${me?'me':'other'}">
<div class="bubble">${m.message}</div>
</div>`;
}
</script>

</body>
</html>
