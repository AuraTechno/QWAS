<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Messenger PRO</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#000;
    color:#fff;
}

/* AUTH */
#auth{
    width:320px;
    margin:120px auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input{
    padding:12px;
    background:#000;
    border:1px solid #fff;
    color:#fff;
}

button{
    padding:12px;
    background:#fff;
    color:#000;
    border:none;
    cursor:pointer;
}

/* CHAT */
#chat{
    display:none;
    height:100vh;
}

/* USERS */
.sidebar{
    width:300px;
    border-right:1px solid #fff;
    overflow:auto;
}

.user{
    display:flex;
    gap:10px;
    padding:15px;
    border-bottom:1px solid #222;
    cursor:pointer;
}

/* AVATAR */
.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    overflow:hidden;
    background:#333;
    display:flex;
    align-items:center;
    justify-content:center;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* CHAT */
.chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

.header{
    padding:15px;
    border-bottom:1px solid #fff;
    display:flex;
    align-items:center;
    gap:10px;
}

.messages{
    flex:1;
    padding:10px;
    overflow:auto;
}

.msg{
    display:flex;
    margin:6px 0;
}

.me{justify-content:flex-end;}
.other{justify-content:flex-start;}

.bubble{
    max-width:60%;
    padding:10px;
}

/* ME */
.me .bubble{
    background:#fff;
    color:#000;
}

/* OTHER */
.other .bubble{
    background:#000;
    color:#fff;
    border:1px solid #fff;
}

/* INPUT */
.input{
    display:flex;
    border-top:1px solid #fff;
}

.input input{
    flex:1;
    border:none;
    background:#000;
    color:#fff;
    padding:15px;
}

/* STATUS */
.status{
    font-size:12px;
    opacity:0.7;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
    <h2>Login</h2>
    <input id="u">
    <input id="p" type="password">
    <button onclick="login()">Войти</button>
    <button onclick="register()">Регистрация</button>
</div>

<!-- CHAT -->
<div id="chat">

    <div class="sidebar" id="users"></div>

    <div class="chat">

        <div class="header">
            <div class="avatar" id="chatAvatar"></div>
            <div>
                <div id="chatName"></div>
                <div class="status" id="status"></div>
            </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input">
            <input id="msg">
        </div>

    </div>
</div>

<script>
const socket=io();

let username="";
let current="";

/* AUTH */
function register(){
fetch("/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})})
}

function login(){
fetch("/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})})
.then(r=>r.json()).then(d=>{
if(d.ok){
username=u.value;
auth.style.display="none";
chat.style.display="flex";
socket.emit("join",username);
}
});
}

/* USERS */
socket.on("users",data=>{
users.innerHTML="";
data.users.forEach(u=>{
if(u.username!==username){
users.innerHTML+=`
<div class="user" onclick="openChat('${u.username}','${u.avatar||''}')">
<div class="avatar">${u.avatar?`<img src="${u.avatar}">`:u.username[0]}</div>
<div>${u.username}</div>
</div>`;
}
});
});

/* OPEN CHAT */
function openChat(u,a){
current=u;
chatName.innerText=u;
chatAvatar.innerHTML=a?`<img src="${a}">`:u[0];
socket.emit("get_history",u);
}

/* HISTORY */
socket.on("chat_history",msgs=>{
messages.innerHTML="";
msgs.forEach(render);
});

/* SEND */
msg.onkeydown=e=>{if(e.key==="Enter"){
socket.emit("private_message",{to:current,message:msg.value});
render({from:username,message:msg.value,time:new Date()});
msg.value="";
}}

/* RENDER */
function render(m){
let me=m.from===username;
messages.innerHTML+=`
<div class="msg ${me?'me':'other'}">
<div class="bubble">${m.message}</div>
</div>`;
}
</script>

</body>
</html>
