<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мессенджер</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body { font-family: Arial; margin:0; }

#auth {
    display:flex;
    flex-direction:column;
    width:300px;
    margin:100px auto;
}

#chat { display:none; height:100vh; }

.sidebar {
    width:200px;
    background:#2f3136;
    color:white;
    float:left;
    height:100%;
}

.user { padding:10px; cursor:pointer; }

.chat {
    margin-left:200px;
    display:flex;
    flex-direction:column;
    height:100%;
}

.messages {
    flex:1;
    padding:10px;
    overflow:auto;
}

.input {
    display:flex;
}
input { flex:1; padding:10px; }
button { padding:10px; }
</style>
</head>

<body>

<div id="auth">
    <h2>Авторизация</h2>

    <input id="username" placeholder="username">
    <input id="password" placeholder="password" type="password">

    <button onclick="register()">Регистрация</button>
    <button onclick="login()">Войти</button>
</div>

<div id="chat">

    <div class="sidebar" id="users"></div>

    <div class="chat">
        <div class="messages" id="messages"></div>

        <div class="input">
            <input id="msg">
            <button onclick="send()">send</button>
        </div>
    </div>

</div>

<script>
const socket = io();
let username = "";
let current = "";

/* ========== AUTH ========== */

async function register() {
    let res = await fetch("/register", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            username: usernameInput().value,
            password: passwordInput().value
        })
    });

    let data = await res.json();
    alert(data.ok ? "OK" : "Ошибка");
}

async function login() {
    let res = await fetch("/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            username: usernameInput().value,
            password: passwordInput().value
        })
    });

    let data = await res.json();

    if (data.ok) {
        username = usernameInput().value;

        document.getElementById("auth").style.display = "none";
        document.getElementById("chat").style.display = "block";

        socket.emit("join", username);
    } else {
        alert("неверный логин");
    }
}

function usernameInput(){ return document.getElementById("username"); }
function passwordInput(){ return document.getElementById("password"); }

/* ========== CHAT ========== */

socket.on("users", list => {
    let box = document.getElementById("users");
    box.innerHTML = "";

    list.forEach(u => {
        if (u !== username) {
            box.innerHTML += `<div class="user" onclick="openChat('${u}')">${u}</div>`;
        }
    });
});

function openChat(u){
    current = u;
    socket.emit("get_history", u);
}

socket.on("chat_history", msgs => {
    let box = document.getElementById("messages");
    box.innerHTML = "";

    msgs.forEach(m => {
        box.innerHTML += `<div><b>${m.from}:</b> ${m.message}</div>`;
    });
});

function send(){
    let msg = document.getElementById("msg").value;

    socket.emit("private_message", {
        to: current,
        message: msg
    });
}
</script>

</body>
</html>
