<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Messenger</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body { margin:0; font-family:Arial; }

#auth {
    width:300px;
    margin:100px auto;
    display:flex;
    flex-direction:column;
}

#chat {
    display:none;
    height:100vh;
}

.sidebar {
    width:220px;
    background:#2f3136;
    color:white;
    float:left;
    height:100%;
}

.user {
    padding:10px;
    cursor:pointer;
}
.user:hover {
    background:#40444b;
}

.chat {
    margin-left:220px;
    display:flex;
    flex-direction:column;
    height:100%;
}

.messages {
    flex:1;
    padding:10px;
    overflow-y:auto;
    background:#f2f2f2;
}

.input {
    display:flex;
}

input { flex:1; padding:10px; }
button { padding:10px; }

.msg {
    margin:5px 0;
    display:flex;
}

.me {
    justify-content:flex-end;
}

.other {
    justify-content:flex-start;
}

.bubble {
    padding:8px 12px;
    border-radius:10px;
    max-width:60%;
    color:white;
}

.me .bubble {
    background:#4caf50;
}

.other .bubble {
    background:#333;
}
</style>
</head>

<body>

<div id="auth">
    <h2>Регистрация / Вход</h2>

    <input id="username" placeholder="username">
    <input id="password" type="password" placeholder="password">

    <button onclick="register()">Регистрация</button>
    <button onclick="login()">Войти</button>
</div>

<div id="chat">

    <div class="sidebar" id="users"></div>

    <div class="chat">
        <div class="messages" id="messages"></div>

        <div class="input">
            <input id="msg">
            <button onclick="send()">Отправить</button>
        </div>
    </div>

</div>

<script>
const socket = io();

let username = "";
let current = "";

/* ================= AUTH ================= */

async function register(){
    let res = await fetch("/register", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username: username.value,
            password: password.value
        })
    });

    let data = await res.json();
    alert(data.ok ? "Успешно" : "Ошибка");
}

async function login(){
    let res = await fetch("/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username: username.value,
            password: password.value
        })
    });

    let data = await res.json();

    if(data.ok){
        username = document.getElementById("username").value;

        document.getElementById("auth").style.display="none";
        document.getElementById("chat").style.display="block";

        socket.emit("join", username);
    } else {
        alert("Ошибка входа");
    }
}

/* ================= USERS ================= */

socket.on("users", list => {
    let box = document.getElementById("users");
    box.innerHTML = "";

    list.forEach(u => {
        if(u !== username){
            box.innerHTML += `<div class="user" onclick="openChat('${u}')">${u}</div>`;
        }
    });
});

function openChat(u){
    current = u;
    socket.emit("get_history", u);
}

/* ================= HISTORY ================= */

socket.on("chat_history", msgs => {
    let box = document.getElementById("messages");
    box.innerHTML = "";

    msgs.forEach(m => render(m.from, m.message));
});

/* ================= SEND ================= */

function send(){
    let msg = document.getElementById("msg").value;

    if(!msg || !current) return;

    socket.emit("private_message", {
        to: current,
        message: msg
    });

    render(username, msg);
    document.getElementById("msg").value = "";
}

/* ================= RECEIVE ================= */

socket.on("private_message", data => {
    if(data.from === current){
        render(data.from, data.message);
    }
});

/* ================= RENDER ================= */

function render(from, text){
    let box = document.getElementById("messages");

    let isMe = from === username;

    box.innerHTML += `
        <div class="msg ${isMe ? 'me' : 'other'}">
            <div class="bubble">${from}: ${text}</div>
        </div>
    `;

    box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
