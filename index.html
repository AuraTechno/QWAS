<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Messenger PRO</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:#fff;
}

/* AUTH */
#auth{
    width:320px;
    margin:120px auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input{
    padding:12px;
    border:none;
    border-radius:8px;
    background:#1c1c1c;
    color:#fff;
    outline:none;
}

button{
    padding:12px;
    border:none;
    border-radius:8px;
    background:#fff;
    color:#000;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    opacity:0.8;
}

/* CHAT */
#chat{
    display:none;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:300px;
    background:#141414;
    border-right:1px solid #222;
    overflow:auto;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
    padding:15px;
    cursor:pointer;
    border-bottom:1px solid #222;
    transition:0.2s;
}

.user:hover{
    background:#1f1f1f;
}

/* AVATAR */
.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#333;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* CHAT */
.chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* HEADER */
.header{
    padding:15px;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    gap:10px;
}

/* MESSAGES */
.messages{
    flex:1;
    padding:15px;
    overflow:auto;
}

/* MSG */
.msg{
    display:flex;
    margin:6px 0;
}

.me{justify-content:flex-end;}
.other{justify-content:flex-start;}

/* BUBBLES */
.bubble{
    max-width:60%;
    padding:10px;
    border-radius:12px;
    position:relative;
    animation:fade 0.2s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(5px);}
    to{opacity:1;}
}

/* ME */
.me .bubble{
    background:#fff;
    color:#000;
}

/* OTHER */
.other .bubble{
    background:#1a1a1a;
    border:1px solid #333;
}

/* TIME */
.time{
    font-size:10px;
    opacity:0.6;
    text-align:center;
    margin-top:4px;
}

/* INPUT */
.input{
    display:flex;
    border-top:1px solid #222;
}

.input input{
    flex:1;
    border:none;
    padding:15px;
    background:#111;
}

.input button{
    width:80px;
}

/* STATUS */
.status{
    font-size:12px;
    opacity:0.7;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
    <h2>Messenger</h2>
    <input id="u" placeholder="username">
    <input id="p" type="password" placeholder="password">
    <button onclick="login()">Войти</button>
    <button onclick="register()">Регистрация</button>
</div>

<!-- CHAT -->
<div id="chat">

    <div class="sidebar" id="users"></div>

    <div class="chat">

        <div class="header">
            <div id="chatName">Чат</div>
            <div class="status" id="status"></div>
        </div>

        <div class="messages" id="messages"></div>

        <!-- 🔥 ВОЗВРАЩЕНА КНОПКА -->
        <div class="input">
            <input id="msg" placeholder="Сообщение...">
            <button onclick="send()">➤</button>
        </div>

    </div>
</div>

<script>
const socket=io();

let username="";
let current="";

/* AUTH */
function register(){
fetch("/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})})
}

function login(){
fetch("/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})})
.then(r=>r.json()).then(d=>{
if(d.ok){
username=u.value;
auth.style.display="none";
chat.style.display="flex";
socket.emit("join",username);
}
});
}

/* USERS */
socket.on("users",data=>{
users.innerHTML="";
data.users.forEach(u=>{
if(u.username!==username){
users.innerHTML+=`
<div class="user" onclick="openChat('${u.username}')">
<div class="avatar">${u.avatar?`<img src="${u.avatar}">`:u.username[0]}</div>
<div>${u.username}</div>
</div>`;
}
});
});

/* CHAT */
function openChat(u){
current=u;
chatName.innerText=u;
socket.emit("get_history",u);
}

/* HISTORY */
socket.on("chat_history",msgs=>{
messages.innerHTML="";
msgs.forEach(render);
});

/* SEND */
function send(){
let text=msg.value;
if(!text||!current)return;

socket.emit("private_message",{to:current,message:text});
render({from:username,message:text,time:new Date()});
msg.value="";
}

/* ENTER */
msg.onkeydown=e=>{
if(e.key==="Enter")send();
};

/* TYPING */
msg.oninput=()=>{
socket.emit("typing",{from:username,to:current});
};

/* RENDER */
function render(m){

let me=m.from===username;

let time=new Date(m.time).toLocaleTimeString([],{
hour:"2-digit",minute:"2-digit"
});

messages.innerHTML+=`
<div class="msg ${me?'me':'other'}">
<div class="bubble">
<div>${m.message}</div>
<div class="time">${time}</div>
</div>
</div>`;

messages.scrollTop=messages.scrollHeight;
}

/* TYPING UI */
socket.on("typing",d=>{
if(d.from===current){
status.innerText="печатает...";
}
});

socket.on("stop_typing",()=>{
status.innerText="";
});
</script>

</body>
</html>
