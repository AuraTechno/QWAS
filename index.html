<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мессенджер</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body { margin:0; font-family:Arial; display:flex; height:100vh; }
#login { margin:auto; }
#chat { display:none; width:100%; }

.sidebar {
    width:250px;
    background:#2f3136;
    color:white;
    padding:10px;
}

.user {
    padding:10px;
    cursor:pointer;
}
.user:hover {
    background:#40444b;
}

.chat {
    flex:1;
    display:flex;
    flex-direction:column;
}

.messages {
    flex:1;
    padding:10px;
    overflow-y:auto;
}

.input {
    display:flex;
}

input { flex:1; padding:10px; }
button { padding:10px; }
</style>
</head>

<body>

<div id="login">
    <h2>Вход</h2>
    <input id="username" placeholder="username">
    <button onclick="login()">Войти</button>
</div>

<div id="chat">
    <div class="sidebar">
        <h3>Пользователи</h3>
        <div id="users"></div>
    </div>

    <div class="chat">
        <div class="messages" id="messages"></div>
        <div class="input">
            <input id="messageInput">
            <button onclick="send()">Отправить</button>
        </div>
    </div>
</div>

<script>
const socket = io();

let username = "";
let currentChat = "";

function login() {
    username = document.getElementById("username").value;

    if (username.length < 3) {
        alert("Минимум 3 символа");
        return;
    }

    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";

    socket.emit("join", username);
}

socket.on("users", (list) => {
    let usersDiv = document.getElementById("users");
    usersDiv.innerHTML = "";

    list.forEach(user => {
        if (user !== username) {
            usersDiv.innerHTML += `<div class="user" onclick="openChat('${user}')">${user}</div>`;
        }
    });
});

function openChat(user) {
    currentChat = user;
    document.getElementById("messages").innerHTML = `<b>Чат с ${user}</b><br>`;
}

function send() {
    let input = document.getElementById("messageInput");
    let msg = input.value;

    if (!msg || !currentChat) return;

    socket.emit("private_message", {
        to: currentChat,
        message: msg
    });

    addMessage("Ты", msg);
    input.value = "";
}

socket.on("private_message", (data) => {
    if (data.from === currentChat) {
        addMessage(data.from, data.message);
    }
});

function addMessage(user, text) {
    let messages = document.getElementById("messages");
    messages.innerHTML += `<div><b>${user}:</b> ${text}</div>`;
}
</script>

</body>
</html>
