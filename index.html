<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Messenger STABLE</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0d0d0d;
    color:#fff;
}

/* AUTH */
#auth{
    width:320px;
    margin:120px auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input{
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1a1a1a;
    color:#fff;
}

button{
    padding:12px;
    border:none;
    border-radius:10px;
    background:#fff;
    color:#000;
    cursor:pointer;
}

/* CHAT */
#chat{
    display:none;
    height:100vh;
}

.sidebar{
    width:300px;
    background:#121212;
    border-right:1px solid #222;
    overflow:auto;
}

.user{
    padding:15px;
    border-bottom:1px solid #222;
    cursor:pointer;
}

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    padding:15px;
    overflow:auto;
}

.msg{display:flex;margin:6px 0;}
.me{justify-content:flex-end;}
.other{justify-content:flex-start;}

.bubble{
    max-width:60%;
    padding:10px;
    border-radius:10px;
}

.me .bubble{background:#fff;color:#000;}
.other .bubble{background:#1a1a1a;border:1px solid #333;}
</style>
</head>

<body>

<div id="auth">
    <input id="u" placeholder="username">
    <input id="p" type="password" placeholder="password">

    <button onclick="register()">Регистрация</button>
    <button onclick="login()">Войти</button>
</div>

<div id="chat">

    <div class="sidebar" id="users"></div>

    <div class="chat">

        <div id="chatName"></div>

        <div class="messages" id="messages"></div>

        <div style="display:flex">
            <input id="msg" style="flex:1">
            <button onclick="send()">➤</button>
        </div>

    </div>
</div>

<script>
const socket=io();

let username="";
let current="";

/* REGISTER */
function register(){
fetch("/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u.value,password:p.value})
});
}

/* LOGIN */
function login(){
fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u.value,password:p.value})
})
.then(r=>r.json())
.then(d=>{
if(d.ok){
username=u.value;
auth.style.display="none";
chat.style.display="flex";
socket.emit("join",username);
}
});
}

/* USERS FIX */
socket.on("users",data=>{

users.innerHTML="";

data.users.forEach(u=>{
if(u.username!==username){

users.innerHTML+=`
<div class="user" onclick="openChat('${u.username}')">
${u.username}
</div>`;
}
});
});

/* OPEN CHAT */
function openChat(u){
current=u;
chatName.innerText=u;
socket.emit("get_history",u);
}

/* SEND */
function send(){
if(!msg.value)return;

socket.emit("private_message",{
to:current,
message:msg.value
});

msg.value="";
}

/* RECEIVE */
socket.on("private_message",m=>{
if(m.from===current||m.from===username){
render(m);
}
});

/* HISTORY */
socket.on("chat_history",msgs=>{
messages.innerHTML="";
msgs.forEach(render);
});

/* RENDER */
function render(m){

let me=m.from===username;

messages.innerHTML+=`
<div class="msg ${me?'me':'other'}">
<div class="bubble">${m.message}</div>
</div>`;
}
</script>

</body>
</html>
